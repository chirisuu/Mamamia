const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

const SISTEMA_IA = `Eres un asesor financiero personal que escribe en español de Perú. Recibes un resumen agregado y anonimizado de las finanzas mensuales de una persona, en soles (S/).

Escribe un análisis breve y concreto con esta estructura:
1. Un párrafo con el diagnóstico general: qué está funcionando y qué no.
2. "Lo más urgente": las 2 o 3 cosas que debería atender primero, cada una con la cifra concreta en soles y el porqué.
3. "Qué hacer este mes": entre 3 y 5 acciones específicas y realizables, cada una con el monto o el porcentaje exacto.
4. Una frase final de cierre, directa y sin paternalismo.

Reglas:
- Usa siempre cifras del resumen. Nada de consejos genéricos que valdrían para cualquiera.
- Formatea los importes como S/ 1,234.56.
- No inventes datos que no estén en el resumen. Si falta información para una conclusión, dilo.
- Nada de moralina ni sermones. Tono de alguien competente que te habla de tú.
- Texto plano con títulos cortos. Sin tablas, sin markdown pesado.
- Si el resumen está casi vacío, dilo en dos líneas y no rellenes.`;

async function pedirAnalisisIA(salida, boton) {
  const key = (S.ajustes.apiKey || "").trim();
  if (!key) return toast("Falta la clave de API. Ponla en Ajustes.");

  boton.disabled = true;
  boton.textContent = "Analizando…";
  salida.textContent = "";
  let texto = "";
  let rechazado = false;
  let truncado = false;

  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-opus-5",
        // El pensamiento adaptativo también consume max_tokens, así que hay que
        // dejar margen de sobra para que la respuesta no se corte a la mitad.
        max_tokens: 16000,
        stream: true,
        thinking: { type: "adaptive" },
        output_config: { effort: "medium" },
        system: SISTEMA_IA,
        messages: [{
          role: "user",
          content: "Analiza estas finanzas:\n\n" + JSON.stringify(resumenParaIA(mesActual), null, 2),
        }],
      }),
    });

    if (!r.ok) {
      let detalle = "";
      try { detalle = (await r.json())?.error?.message || ""; } catch { /* respuesta no JSON */ }
      const msg = {
        401: "La clave de API no es válida o fue revocada. Revísala en Ajustes.",
        403: "Esa clave no tiene permiso para usar este modelo.",
        429: "Has alcanzado el límite de peticiones o de crédito. Espera un momento y reinténtalo.",
        400: "La petición fue rechazada" + (detalle ? `: ${detalle}` : "."),
      }[r.status] || `Error ${r.status} del servidor${detalle ? `: ${detalle}` : ". Reinténtalo en un momento."}`;
      throw new Error(msg);
    }

    const lector = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await lector.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let corte;
      while ((corte = buf.indexOf("\n\n")) >= 0) {
        const bloque = buf.slice(0, corte);
        buf = buf.slice(corte + 2);
        for (const linea of bloque.split("\n")) {
          if (!linea.startsWith("data:")) continue;
          const crudo = linea.slice(5).trim();
          if (!crudo || crudo === "[DONE]") continue;
          let ev;
          try { ev = JSON.parse(crudo); } catch { continue; }
          if (ev.type === "error") throw new Error(ev.error?.message || "Error durante la respuesta.");
          if (ev.type === "message_delta" && ev.delta?.stop_reason === "refusal") rechazado = true;
          if (ev.type === "message_delta" && ev.delta?.stop_reason === "max_tokens") truncado = true;
          if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") {
            texto += ev.delta.text;
            salida.textContent = texto;      // textContent, nunca innerHTML
          }
        }
      }
    }

    // Se comprueba el rechazo antes de dar por buena la respuesta.
    if (rechazado) {
      salida.textContent = "El modelo declinó responder a esta petición. Prueba de nuevo o revisa si hay algo inusual en los datos.";
      return;
    }
    if (!texto.trim()) { salida.textContent = "El modelo no devolvió texto. Reinténtalo."; return; }
    if (truncado) salida.textContent = texto + "\n\n[La respuesta se cortó por llegar al límite de tokens.]";
  } catch (e) {
    salida.textContent = "";
    toast(e.message || "No se pudo conectar con la API.");
    console.error(e);
  } finally {
    boton.disabled = false;
    boton.textContent = "Pedir análisis";
  }
}

/* ============================================================================
   §9 · DATOS DE EJEMPLO
   ========================================================================== */

function datosEjemplo() {
  const e = estadoInicial();
  const id = (n) => e.categorias.find((c) => c.nombre === n).id;
  const diaDe = (mes, d) => `${mes}-${String(d).padStart(2, "0")}`;
  const mov = (fecha, tipo, monto, categoria, nota, cuenta = "BCP") =>
    e.movimientos.push({ id: uid(), fecha, tipo, monto, categoriaId: id(categoria), nota, cuenta, recurrencia: "ninguna" });

  const meses = [mesSuma(mesHoy(), -2), mesSuma(mesHoy(), -1), mesHoy()];
  const sueldos = [4200, 4200, 4200];
  const extras = [0, 850, 400];

  meses.forEach((m, k) => {
    mov(diaDe(m, 2), "ingreso", sueldos[k], "Sueldo", "Sueldo mensual");
    if (extras[k]) mov(diaDe(m, 18), "ingreso", extras[k], "Negocio", "Trabajo freelance");

    mov(diaDe(m, 3), "gasto", 1250, "Alquiler", "Alquiler del depa");
    mov(diaDe(m, 5), "gasto", 180 + k * 15, "Servicios", "Luz y agua");
    mov(diaDe(m, 5), "gasto", 89, "Servicios", "Internet");
    mov(diaDe(m, 8), "gasto", 420 + k * 30, "Comida", "Mercado quincenal");
    mov(diaDe(m, 22), "gasto", 380, "Comida", "Mercado quincenal");
    mov(diaDe(m, 10), "gasto", 160, "Transporte", "Combustible");
    mov(diaDe(m, 24), "gasto", 140, "Transporte", "Combustible");
    mov(diaDe(m, 12), "gasto", 300, "Deudas", "Cuota tarjeta");
    mov(diaDe(m, 15), "gasto", 500, "Ahorro", "Aporte a ahorro");
    mov(diaDe(m, 20), "gasto", 210 + k * 60, "Ocio", "Salidas y cine");
    if (k === 2) mov(diaDe(m, 14), "gasto", 480, "Ropa", "Zapatillas y polos");
    if (k === 1) mov(diaDe(m, 9), "gasto", 260, "Salud", "Consulta y medicinas");

    // Gasto hormiga: cafés y delivery pequeños del mes en curso
    if (k === 2) for (let d = 2; d <= 26; d += 2) mov(diaDe(m, d), "gasto", 12 + (d % 5) * 3, "Comida", "Café / delivery", "Yape");
  });

  e.presupuestos = {
    [id("Comida")]: 800, [id("Transporte")]: 320, [id("Ocio")]: 250,
    [id("Servicios")]: 300, [id("Ropa")]: 200,
  };

  // La deuda más grande es también la más cara, para que bola de nieve y
  // avalancha den resultados distintos y el simulador enseñe algo.
  e.deudas = [
    { id: uid(), nombre: "Tarjeta BCP", tipo: "tarjeta", saldo: 6800, tea: 62, cuota: 420, diaPago: 12 },
    { id: uid(), nombre: "Préstamo personal", tipo: "prestamo", saldo: 4200, tea: 24, cuota: 360, diaPago: 20 },
    { id: uid(), nombre: "Préstamo a mamá", tipo: "familiar", saldo: 900, tea: 0, cuota: 150, diaPago: 28 },
  ];

  const hoy = new Date();
  const enDias = (n) => {
    const d = new Date(hoy.getTime() + n * 86400000);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  e.suscripciones = [
    { id: uid(), nombre: "Netflix", monto: 44.9, periodicidad: "mensual", proximoCobro: enDias(6), activa: true, usada: true },
    { id: uid(), nombre: "Spotify", monto: 26.9, periodicidad: "mensual", proximoCobro: enDias(14), activa: true, usada: true },
    { id: uid(), nombre: "Gimnasio", monto: 129, periodicidad: "mensual", proximoCobro: enDias(3), activa: true, usada: false },
    { id: uid(), nombre: "Almacenamiento en la nube", monto: 320, periodicidad: "anual", proximoCobro: enDias(51), activa: true, usada: true },
    { id: uid(), nombre: "Curso de inglés", monto: 380, periodicidad: "trimestral", proximoCobro: enDias(22), activa: true, usada: false },
  ];

  e.cuentas = [
    { id: uid(), nombre: "Cuenta sueldo BCP", saldo: 2600 },
    { id: uid(), nombre: "Efectivo", saldo: 400 },
  ];

  const enMeses = (n) => {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
  };
  e.metas = [
    { id: uid(), nombre: "Fondo de emergencia", objetivo: 12000, aporteMensual: 500, fechaObjetivo: enMeses(12),
      aportes: meses.map((m, i) => ({ id: uid(), fecha: diaDe(m, 15), monto: [500, 500, 300][i] })) },
    { id: uid(), nombre: "Viaje a Cusco", objetivo: 3500, aporteMensual: 300, fechaObjetivo: enMeses(6),
      aportes: [{ id: uid(), fecha: diaDe(meses[0], 20), monto: 300 }] },
  ];

  return e;
}

/* ============================================================================
   §10 · RENDER Y EVENTOS
   ========================================================================== */

function aplicarTema() {
  const t = S.ajustes.tema || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema", t);
}

function pintarTabs() {
  document.getElementById("tabs").innerHTML = TABS
    .map(([id, nom]) => `<button data-act="ir" data-v="${id}"${vista === id ? ' aria-current="page"' : ""}>${esc(nom)}</button>`)
    .join("");
}

const VISTAS = {
  panel: vistaPanel, movimientos: vistaMovimientos, presupuestos: vistaPresupuestos,
  deudas: vistaDeudas, suscripciones: vistaSuscripciones, ahorro: vistaAhorro,
  consejos: vistaConsejos, ajustes: vistaAjustes,
};

function render() {
  graficos.clear();
  document.getElementById("mes-lab").textContent = mesNombre(mesActual);
  pintarTabs();
  const app = document.getElementById("app");
  try {
    app.innerHTML = (VISTAS[vista] || vistaPanel)();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="card"><h2>Algo se rompió al dibujar esta sección</h2>
      <p class="sub">${esc(e.message)}</p>
      <p class="sub">Puedes exportar tus datos desde Ajustes y recargar la página.</p></div>`;
  }
  pintarGraficos();
}

function irA(v) { vista = v; render(); window.scrollTo({ top: 0 }); }

/* ---- Delegación de eventos ---- */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const id = b.dataset.id;
  const acc = b.dataset.act;

  switch (acc) {
    case "ir": return irA(b.dataset.v);

    case "nuevo-mov":   return formMovimiento(null);
    case "edit-mov":    return formMovimiento(id);
    case "del-mov":     return borrar("movimientos", id, "este movimiento");

    case "nueva-cat":   return formCategoria(null);
    case "edit-cat":    return formCategoria(id);
    case "del-cat": {
      const usados = S.movimientos.filter((m) => m.categoriaId === id).length;
      if (usados) return toast(`No se puede borrar: hay ${usados} movimiento${usados === 1 ? "" : "s"} en esa categoría.`);
      return borrar("categorias", id, "esta categoría");
    }

    case "nueva-deuda": return formDeuda(null);
    case "edit-deuda":  return formDeuda(id);
    case "del-deuda":   return borrar("deudas", id, "esta deuda");

    case "nueva-susc":  return formSuscripcion(null);
    case "edit-susc":   return formSuscripcion(id);
    case "del-susc":    return borrar("suscripciones", id, "esta suscripción");
    case "toggle-usada":
      return commit(() => { const s = S.suscripciones.find((x) => x.id === id); s.usada = s.usada === false; });
    case "toggle-activa":
      return commit(() => { const s = S.suscripciones.find((x) => x.id === id); s.activa = s.activa === false; });

    case "nueva-cuenta": return formCuenta(null);
    case "edit-cuenta":  return formCuenta(id);
    case "del-cuenta":   return borrar("cuentas", id, "esta cuenta");

    case "nueva-meta":  return formMeta(null);
    case "edit-meta":   return formMeta(id);
    case "del-meta":    return borrar("metas", id, "esta meta");
    case "aporte":      return formAporte(id);

    case "exportar":    return exportarJSON();
    case "importar":    return document.getElementById("file-import")?.click();
    case "ejemplo":
      if (S.movimientos.length && !confirm("Esto reemplaza todos tus datos actuales por los de ejemplo. ¿Seguir?")) return;
      S = datosEjemplo(); mesActual = mesHoy(); guardar(); aplicarTema(); render();
      return toast("Datos de ejemplo cargados.");
    case "borrar-todo":
      if (!confirm("Se borrarán TODOS tus datos de este navegador. ¿Seguro?")) return;
      if (!confirm("Última confirmación: esto no se puede deshacer. ¿Borrar todo?")) return;
      S = estadoInicial(); mesActual = mesHoy(); guardar(); aplicarTema(); render();
      return toast("Todo borrado.");
    case "borrar-key":
      return commit((S) => { S.ajustes.apiKey = ""; });
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "f-tipo") { filtros.tipo = t.value; return render(); }
  if (t.id === "f-cat")  { filtros.categoria = t.value; return render(); }
  if (t.id === "cfg-tema")  return commit((S) => { S.ajustes.tema = t.value; aplicarTema(); });
  if (t.id === "cfg-emg")   return commit((S) => { S.ajustes.mesesEmergencia = num(t.value); });
  if (t.id === "cfg-key")   { S.ajustes.apiKey = t.value.trim(); guardar(); return toast("Clave guardada en este navegador."); }
  if (t.id === "file-import" && t.files?.[0]) return importarJSON(t.files[0]);
  if (t.dataset.presupuesto) {
    const v = num(t.value);
    return commit((S) => {
      if (v > 0) S.presupuestos[t.dataset.presupuesto] = v;
      else delete S.presupuestos[t.dataset.presupuesto];
    });
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "f-texto") {
    filtros.texto = t.value;
    clearTimeout(document._ft);
    document._ft = setTimeout(() => {
      render();
      const n = document.getElementById("f-texto");
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 260);
  }
  if (t.id === "sim-extra") {
    simExtra = num(t.value);
    clearTimeout(document._fs);
    document._fs = setTimeout(() => {
      render();
      const n = document.getElementById("sim-extra");
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 320);
  }
});

document.addEventListener("click", (ev) => {
  if (ev.target.id === "btn-ia") {
    pedirAnalisisIA(document.getElementById("ia-salida"), ev.target);
  }
});

document.getElementById("mes-prev").onclick = () => { mesActual = mesSuma(mesActual, -1); render(); };
document.getElementById("mes-next").onclick = () => { mesActual = mesSuma(mesActual, 1); render(); };
document.getElementById("tema-btn").onclick = () => {
  const orden = ["auto", "claro", "oscuro"];
  const i = orden.indexOf(S.ajustes.tema || "auto");
  commit((S) => { S.ajustes.tema = orden[(i + 1) % 3]; aplicarTema(); });
  toast("Tema: " + { auto: "según el sistema", claro: "claro", oscuro: "oscuro" }[S.ajustes.tema]);
};

/* ---- Tooltips de los gráficos ---- */
const tip = document.getElementById("tip");
function moverTip(x, y) {
  const r = tip.getBoundingClientRect();
  const px = Math.min(Math.max(8, x + 12), window.innerWidth - r.width - 8);
  const py = y - r.height - 12 < 8 ? y + 18 : y - r.height - 12;
  tip.style.left = px + "px";
  tip.style.top = py + "px";
}
document.addEventListener("pointerover", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) return;
  tip.textContent = el.dataset.tip;
  tip.classList.add("on");
  moverTip(e.clientX, e.clientY);
});
document.addEventListener("pointermove", (e) => {
  if (tip.classList.contains("on")) moverTip(e.clientX, e.clientY);
});
document.addEventListener("pointerout", (e) => {
  if (e.target.closest?.("[data-tip]")) tip.classList.remove("on");
});
document.addEventListener("focusin", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) return;
  const r = el.getBoundingClientRect();
  tip.textContent = el.dataset.tip;
  tip.classList.add("on");
  moverTip(r.left + r.width / 2, r.top);
});
document.addEventListener("focusout", () => tip.classList.remove("on"));

let rzTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(pintarGraficos, 150);
});

/* ---- Arranque ---- */
function arrancar() {
  aplicarTema();
  if (!mesActual) mesActual = mesHoy();
  render();
}

cargar();
arrancar();
</script>
