<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
    <title>Sin conexión</title>
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <style>
      /* Página autónoma (la sirve el service worker sin red): sin CSS ni JS externos.
         Colores = tokens de src/app/globals.css (claro y oscuro). */
      :root {
        color-scheme: light dark;
        --background: #f7f8fa;
        --foreground: #17181c;
        --card: #ffffff;
        --muted-foreground: #5f6068;
        --border: #e4e6ea;
        --primary: #ff6b00;
        --primary-foreground: #17181c;
        --ring: #d65a00;
        --dot: #17181c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #17181c;
          --foreground: #f7f8fa;
          --card: #25262c;
          --muted-foreground: #a1a1aa;
          --border: #33343b;
          --ring: #ff9f43;
          --dot: #f7f8fa;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        display: grid;
        gap: 20px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--card);
        text-align: center;
        justify-items: center;
      }
      svg { width: 56px; height: 56px; }
      h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.01em; }
      p { margin: 0; line-height: 1.55; color: var(--muted-foreground); }
      button {
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 1.25rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
      .dot { fill: var(--dot); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <path d="M38.42 14.99 A17 17 0 1 1 18.75 7.83" stroke="#ff6b00" stroke-width="7" stroke-linecap="round" />
        <circle class="dot" cx="29.81" cy="8.03" r="4.2" />
      </svg>
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar esta página porque tu dispositivo no tiene internet. Cuando vuelvas a conectarte, podrás seguir
        registrando con normalidad.
      </p>
      <p>Lo que no llegaste a guardar no se envió: revísalo cuando vuelva la conexión.</p>
      <button type="button" id="retry">Reintentar</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });
      // Si vuelve la conexión, recargamos solos.
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
