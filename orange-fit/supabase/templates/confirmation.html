<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#F7F8FA;font-family:Inter,Arial,sans-serif;color:#17181C">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
      <tr>
        <td>
          <p style="margin:0 0 8px;font-size:14px;font-weight:700;letter-spacing:.04em;color:#B84A00">ORANGE FIT</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3">Confirma tu correo</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5">
            Toca el botón para activar tu cuenta. El enlace vence en 1 hora y funciona aunque lo abras en otro navegador.
          </p>
          <p style="margin:0 0 24px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
               style="display:inline-block;background:#FF6B00;color:#17181C;font-weight:700;font-size:16px;text-decoration:none;padding:14px 24px;border-radius:12px">
              Confirmar mi correo
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#52525B">
            Si no creaste una cuenta, ignora este mensaje: no se activará nada.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
