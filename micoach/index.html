  }).join("");
  return `<div class="card">
    <h2>Intercambios equivalentes</h2>
    <p class="sub">Cambia un alimento por otro de su grupo sin moverte de tus macros. Se iguala la ${macro}.</p>
    <label class="campo"><span>Alimento</span><select id="sel-intercambio">${opciones}</select></label>
    <p><b>1 porción:</b> ${esc(a.nombre)} (${esc(a.porcion)}) · ${fmt(a.kcal)} kcal · P ${fmt(a.p, 1)} · C ${fmt(a.c, 1)} · G ${fmt(a.g, 1)}</p>
    ${eq.length ? `<p class="sub">Equivale a:</p>
    <ul class="lista">${eq.map((e) => `<li><div class="crece"><div class="nom">${esc(textoItem({ a: e.b.id, c: e.c }))}</div>
      <div class="tenue num">${fmt(e.kcal)} kcal · P ${fmt(e.p)} · C ${fmt(e.cc)} · G ${fmt(e.g)}</div></div></li>`).join("")}</ul>`
      : '<p class="sub">No hay otro alimento de este grupo para comparar.</p>'}
  </div>`;
}

function dietaCompras() {
  const { filas, total } = listaCompras();
  const tope = S.perfil.topeCompras;
  const sem = lunesDe(hoyISO());
  const marcadas = new Set(S.compradas[sem] || []);
  const falta = suma(filas.filter((f) => !marcadas.has(f.clave)).map((f) => f.subtotal));
  const pct = tope ? (total / tope) * 100 : 0;
  const col = pct > 100 ? "--critico" : pct > 90 ? "--aviso" : "--acento";
  let h = `<div class="card${pct > 100 ? " peligro" : ""}">
    <div class="card-cab"><b class="crece">Compras de la semana</b><span class="num"><b>${soles(total)}</b> / ${soles(tope)}</span></div>
    <div class="barra-prog"><i style="width:${Math.min(100, pct)}%;background:var(${col})"></i></div>
    <p class="sub" style="margin-top:8px">Sale de tu plan semanal, en crudo.${marcadas.size ? ` Falta comprar: <b>${soles(falta)}</b>.` : ""} Los precios son de referencia: cámbialos por los de tu mercado.</p>
    ${pct > 100 ? `<p class="malo"><b>Te pasas por ${soles(total - tope)}.</b> Lo que más pesa: ${filas.slice(0, 3).map((f) => `${esc(f.nombre)} (${soles(f.subtotal)})`).join(", ")}. Cambia parte del pescado o la carne por pollo, huevos o menestras, y compra fruta de estación.</p>` : ""}
  </div>`;
  h += `<div class="card"><ul class="lista">${filas.map((f) => {
    const ok = marcadas.has(f.clave);
    return `<li>
      <button class="icono-btn" data-act="comprado" data-id="${f.clave}" aria-pressed="${ok}" aria-label="${ok ? "Desmarcar" : "Marcar comprado"}: ${esc(f.nombre)}" style="${ok ? "background:var(--acento);color:#0b0b0b" : ""}">${ok ? "✓" : ""}</button>
      <div class="crece"${ok ? ' style="opacity:.55"' : ""}><div class="nom">${esc(f.nombre)}</div>
        <div class="tenue num">${fmtCompra(f.cant, f.u)} · <b>${soles(f.subtotal)}</b></div></div>
      <label style="width:92px;flex:none"><span class="tenue">S/ por ${esc(f.u)}</span>
        <input type="number" inputmode="decimal" step="0.01" min="0" data-precio="${f.clave}" value="${f.precio}" style="min-height:40px;padding:6px 8px;text-align:right"></label>
    </li>`;
  }).join("") || '<li class="sub">Tu plan está vacío.</li>'}</ul></div>`;
  h += `<div class="card">
    <label class="campo"><span>Tope semanal (S/)</span><input type="number" inputmode="decimal" id="tope-compras" value="${tope}"></label>
    <button class="btn ancho" data-act="compras-desmarcar">Desmarcar todo</button>
  </div>`;
  return h;
}

/* -------------------------------- ENTRENO -------------------------------- */

function tarjetaEjercicio(ej, i, f, soloVer) {
  const ant = anterior(ej.ejId, f);
  const cons = consejoCarga(ej, ant);
  const unidad = ej.unidad === "s" ? "seg" : "reps";
  const dis = soloVer ? " disabled" : "";
  const filas = ej.series.map((s, si) => {
    const antS = ant ? ant.series[Math.min(si, ant.series.length - 1)] : null;
    const defPeso = cons.peso ?? antS?.peso ?? "";
    const defReps = cons.reps ?? antS?.reps ?? "";
    return `<div class="serie${s.hecho ? " hecha" : ""}">
      <span class="n">${si + 1}</span>
      <input type="number" inputmode="decimal" step="0.5" min="0" data-campo="peso" data-e="${i}" data-s="${si}" value="${s.peso ?? ""}"
        placeholder="${defPeso === "" ? (ej.unidad === "s" ? "—" : "kg") : fmt(defPeso, 1)}" data-def="${defPeso}" aria-label="Kilos, serie ${si + 1}"${dis}>
      <input type="number" inputmode="numeric" min="0" data-campo="reps" data-e="${i}" data-s="${si}" value="${s.reps ?? ""}"
        placeholder="${defReps === "" ? rangoTxt(ej).replace(" s", "") : defReps}" data-def="${defReps}" aria-label="${unidad === "seg" ? "Segundos" : "Repeticiones"}, serie ${si + 1}"${dis}>
      <button class="ok" data-act="serie-ok" data-e="${i}" data-s="${si}" aria-label="Serie ${si + 1} hecha" aria-pressed="${s.hecho}"${dis}>✓</button>
    </div>`;
  }).join("");
  return `<div class="card ejercicio">
    <div class="cab">
      <div class="crece"><h3>${esc(ej.nombre)}${ej.dolio ? ' <span class="etq hombro">dolió</span>' : ""}</h3>
        <div class="rango">${ej.plan || ej.series.length} × ${rangoTxt(ej)} · descanso ${ej.descanso} s${ej.sustDe ? ` · en vez de ${esc(ej.sustDe)}` : ""}</div></div>
      ${ej.zona && !soloVer ? `<button class="btn chico dolio" data-act="dolio-abrir" data-i="${i}">Me dolió</button>` : ""}
    </div>
    <div class="anterior">${esc(textoAnterior(ej, ant))}</div>
    <div class="consejo${cons.tipo === "sube" ? " sube" : ""}">${esc(cons.texto)}</div>
    <div class="cols-serie" aria-hidden="true"><span>#</span><span>kg</span><span>${unidad}</span><span>ok</span></div>
    ${filas}
    ${soloVer ? "" : `<div class="botones">
      <button class="btn chico fantasma" data-act="serie-mas" data-e="${i}">+ Serie</button>
      ${ej.series.length > 1 ? `<button class="btn chico fantasma" data-act="serie-menos" data-e="${i}">− Serie</button>` : ""}
    </div>`}
  </div>`;
}

function vistaEntreno() {
  const f = fecha;
  const ses = S.sesiones[f];
  if (!entDia) entDia = ses?.dia || claveDia(f);
  const r = rutinaDe(entDia);
  const soloVer = !!ses && ses.dia !== entDia;
  let h = "";
  if (S.perfil.restriccion) h += `<div class="card alerta"><b>Cuidado:</b> ${esc(S.perfil.restriccion)}</div>`;
  h += `<div class="chips"${S.perfil.restriccion ? ' style="margin-top:12px"' : ""}>${DIAS_ORDEN.map((d) =>
    `<button class="chip" data-act="ent-dia" data-v="${d}" aria-pressed="${entDia === d}">${DIA_CORTO[d]}${d === claveDia(f) ? " ·hoy" : ""}</button>`).join("")}</div>`;
  h += `<div class="card">
    <div class="card-cab" style="margin:0">
      <div class="crece"><h2>${DIA_NOMBRE[entDia]} · ${esc(r.nombre)}</h2>
      <div class="sub">${horaBonita(S.horarios.entreno)}${entDia !== claveDia(f) && !soloVer ? ` · la haces el ${fechaDia(f)}` : ""}</div></div>
      <button class="btn chico" data-act="rut-abrir" data-dia="${entDia}">Editar rutina</button>
    </div>
    ${soloVer ? `<p class="aviso-txt" style="margin-top:8px">El ${fechaDia(f)} ya registraste ${DIA_NOMBRE[ses.dia].toLowerCase()} (${esc(rutinaDe(ses.dia).nombre)}). Esto es solo para ver.</p>` : ""}
  </div>`;
  const ejs = ejerciciosVista(f, entDia);
  ejs.forEach((ej, i) => { h += tarjetaEjercicio(ej, i, f, soloVer); });
  if (!ejs.length) h += `<div class="card"><p>Día de descanso. Recupera, camina y come tu proteína.</p></div>`;
  if (r.cardio && !soloVer) {
    h += `<div class="card"><b>Cardio</b>
      <button class="toggle" data-act="cardio" data-dia="${entDia}" aria-pressed="${!!leerDia(f).cardio?.hecho}">
      <span class="caja"></span><span class="crece">${cardioTxt(r.cardio)}</span></button></div>`;
  }
  if (ejs.length && !soloVer) {
    h += `<div class="botones"><button class="btn prim grande" data-act="ent-terminar">${ses?.terminado ? "Entreno terminado ✓" : "Terminar entreno"}</button></div>`;
  }
  h += `<p class="tenue" style="margin-top:14px">Bloqueados por cuidado de hombro: press tras nuca, fondos y remo al mentón. Nunca se proponen.</p>`;
  return h;
}

/* -------------------------------- PROGRESO ------------------------------- */

function vistaProgreso() {
  const hoy = hoyISO();
  const up = ultimoPeso(), p7 = prom7(hoy), ritmo = ritmoSemanal(hoy);
  const actual = p7 ?? up?.kg ?? null;
  const perdido = S.perfil.pesoInicial != null && actual != null ? S.perfil.pesoInicial - actual : null;
  const colRitmo = ritmo == null ? "" : ritmo > 1.2 ? "malo" : ritmo >= 0.8 ? "bien" : ritmo < 0.5 ? "aviso-txt" : "";
  let h = `<div class="kpis">
    <div class="kpi"><div class="et">Último peso</div><div class="va num">${up ? fmt(up.kg, 1) : "—"}</div><div class="pi">${up ? fechaDia(up.fecha) : "sin datos"}</div></div>
    <div class="kpi"><div class="et">Promedio 7 días</div><div class="va num">${p7 != null ? fmt(p7, 1) : "—"}</div><div class="pi">${p7 != null ? "kg" : "faltan pesajes (3+)"}</div></div>
    <div class="kpi"><div class="et">Ritmo semanal</div><div class="va num ${colRitmo}">${ritmo != null ? `${conSigno(-ritmo)}` : "—"}</div><div class="pi">kg/sem · objetivo −0.8 a −1</div></div>
    <div class="kpi"><div class="et">Bajaste en total</div><div class="va num">${perdido != null ? fmt(perdido, 1) : "—"}</div><div class="pi">kg desde ${kg(S.perfil.pesoInicial)}</div></div>
  </div>`;

  h += `<div class="card" style="margin-top:12px">
    <div class="card-cab"><b class="crece">Registrar</b></div>
    <div class="dos-col">
      <label class="campo"><span>Fecha</span><input type="date" id="reg-fecha" value="${hoy}" max="${hoy}"></label>
      <label class="campo"><span>Peso (kg)</span><input type="number" inputmode="decimal" step="0.1" id="reg-peso" placeholder="${up ? fmt(up.kg, 1) : "kg"}"></label>
    </div>
    <div class="botones"><button class="btn prim" data-act="guardar-peso">Guardar peso</button></div>
    <div class="dos-col" style="margin-top:12px">
      <label class="campo"><span>Cintura (cm)</span><input type="number" inputmode="decimal" step="0.5" id="reg-cintura" placeholder="cm, a la altura del ombligo"></label>
      <div style="display:flex;align-items:flex-end"><button class="btn ancho" data-act="guardar-cintura">Guardar cintura</button></div>
    </div>
  </div>`;

  h += `<div class="card">
    <div class="card-cab"><b class="crece">Peso y promedio de 7 días</b></div>
    <div class="chips" style="margin-bottom:8px">${[[30, "30 días"], [90, "90 días"], [0, "Todo"]].map(([v, t]) =>
      `<button class="chip" data-act="rango-peso" data-v="${v}" aria-pressed="${rangoPeso === v}">${t}</button>`).join("")}</div>
    ${fechasPeso().length ? lienzo("g-peso", cfgPeso, "Peso diario y promedio móvil de 7 días") : '<p class="sub">Registra tu peso para ver el gráfico.</p>'}
  </div>`;

  const pr = proyeccion(hoy);
  h += `<div class="card"><div class="card-cab"><b class="crece">Fechas proyectadas</b>
    ${pr.kgSemana != null ? `<span class="sub">tendencia ${conSigno(-pr.kgSemana)} kg/sem</span>` : ""}</div>
    <ul class="lista">${pr.metas.map((r) => `<li>
      <div class="crece"><div class="nom">${r.nombre}: ${kg(r.meta)}</div>
        <div class="tenue">${r.lograda ? "Lograda." : `Faltan ${fmt(r.falta, 1)} kg · al ritmo objetivo: entre ${fechaMedia(r.rapida)} y ${fechaMedia(r.lenta)}`}</div></div>
      <div class="der">${r.lograda ? '<span class="etq ok">✓</span>' : r.fecha ? `<b>${esc(fechaMedia(r.fecha))}</b><div class="tenue">a tu ritmo real</div>` : '<span class="sub">sin fecha</span>'}</div>
    </li>`).join("") || '<li class="sub">Define tus metas de peso en Perfil.</li>'}</ul>
    ${!pr.suficiente ? '<p class="tenue">Para proyectar con tu ritmo real hacen falta unas 2 semanas de pesajes (3 o más por semana).</p>'
      : pr.kgSemana <= 0.07 ? '<p class="aviso-txt">Tu promedio no está bajando: no hay fecha real hasta que retome.</p>' : ""}
  </div>`;

  const sem = adherenciaSemana(lunesDe(hoy), hoy);
  h += `<div class="card"><div class="card-cab"><b class="crece">Adherencia semanal</b></div>
    <div class="kpis">
      <div class="kpi"><div class="et">Racha dieta</div><div class="va num">${racha(cumpleDieta)}</div><div class="pi">días · mejor ${mejorRacha(cumpleDieta)}</div></div>
      <div class="kpi"><div class="et">Racha verduras</div><div class="va num">${racha(cumpleVerdura)}</div><div class="pi">días · mejor ${mejorRacha(cumpleVerdura)}</div></div>
    </div>
    <p class="sub" style="margin-top:10px">Esta semana: kcal en rango ${fmt(sem.kcal)} % · proteína ${fmt(sem.prot)} % · entrenos ${sem.hechos}/${sem.planeados}.
    Un día cumple si las kcal quedan a ±10 % de la meta y la proteína llega al 90 %.</p>
    ${Object.keys(S.dias).length ? lienzo("g-adh", cfgAdherencia, "Adherencia de las últimas semanas") : ""}
  </div>`;

  const fc = Object.keys(S.cintura).sort();
  h += `<div class="card"><div class="card-cab"><b class="crece">Cintura</b>
    ${fc.length ? `<span class="num">${fmt(S.cintura[fc[fc.length - 1]], 1)} cm${fc.length > 1 ? ` <span class="sub">(${conSigno(S.cintura[fc[fc.length - 1]] - S.cintura[fc[0]])} cm)</span>` : ""}</span>` : ""}</div>
    ${fc.length > 1 ? lienzo("g-cintura", cfgCintura, "Medida de cintura", true) : '<p class="sub">Mídete una vez por semana, mismo día y misma hora.</p>'}
  </div>`;

  const fp = fechasPeso().reverse();
  h += `<div class="card"><details><summary>Historial (${fp.length} pesajes, ${fc.length} medidas)</summary>
    <ul class="lista">${fp.map((f) => `<li><div class="crece">${esc(fechaDia(f))}</div><span class="num">${kg(S.pesos[f])}</span>
      <button class="icono-btn" data-act="peso-borrar" data-id="${f}" aria-label="Borrar pesaje del ${fechaCorta(f)}">✕</button></li>`).join("")}
    ${[...fc].reverse().map((f) => `<li><div class="crece">${esc(fechaDia(f))} · cintura</div><span class="num">${fmt(S.cintura[f], 1)} cm</span>
      <button class="icono-btn" data-act="cintura-borrar" data-id="${f}" aria-label="Borrar medida del ${fechaCorta(f)}">✕</button></li>`).join("")}</ul>
  </details></div>`;
  return h;
}

/* --------------------------------- PERFIL -------------------------------- */

const AVISO_MEDICO = "MiCoach es una herramienta de orientación. No reemplaza a un médico ni a un nutricionista.";

function campoNum(etq, attr, clave, valor, extra = "") {
  return `<label class="campo"><span>${etq}</span><input type="number" inputmode="decimal" ${attr}="${clave}" value="${valor ?? ""}" ${extra}></label>`;
}

function vistaPerfil() {
  const pf = S.perfil, m = S.metas;
  const peso = pesoActual();
  const T = tmb(pf.sexo, peso, pf.altura, pf.edad), G = T * pf.factor;
  const kc = kcalCalculadas(peso);
  const sumaMacros = m.p * 4 + m.c * 4 + m.g * 9;
  let h = `<div class="card aviso-medico"><b>Aviso:</b> ${AVISO_MEDICO}</div>`;

  h += `<div class="card destacada">
    <div class="card-cab"><b class="crece">Resumen para tu coach</b><span class="sub">últimos 7 días</span></div>
    <p class="sub">Peso promedio, adherencia a kcal y proteína, entrenos, sueño, molestias y notas, listo para pegar.</p>
    <div class="botones"><button class="btn prim grande" data-act="copiar-resumen">Copiar resumen semanal</button></div>
    ${navigator.share ? `<div class="botones"><button class="btn" data-act="compartir">Compartir…</button></div>` : ""}
    <details style="margin-top:8px"><summary>Ver el texto</summary><pre class="resumen">${esc(resumenSemanal())}</pre></details>
  </div>`;

  h += `<h2 class="titulo-sec">Tus datos</h2><div class="card">
    <div class="dos-col">
      <label class="campo"><span>Sexo</span><select data-perfil="sexo">
        <option value="hombre"${pf.sexo === "hombre" ? " selected" : ""}>Hombre</option>
        <option value="mujer"${pf.sexo === "mujer" ? " selected" : ""}>Mujer</option></select></label>
      ${campoNum("Edad", "data-perfil", "edad", pf.edad)}
      ${campoNum("Altura (cm)", "data-perfil", "altura", pf.altura)}
      ${campoNum("Peso inicial (kg)", "data-perfil", "pesoInicial", pf.pesoInicial, 'step="0.1"')}
      ${campoNum("Meta intermedia (kg)", "data-perfil", "metaIntermedia", pf.metaIntermedia, 'step="0.1"')}
      ${campoNum("Meta final (kg)", "data-perfil", "metaFinal", pf.metaFinal, 'step="0.1"')}
    </div>
    <label class="campo" style="margin-top:10px"><span>Restricción o lesión (se muestra en Entreno)</span>
      <input type="text" data-perfil="restriccion" value="${esc(pf.restriccion)}" placeholder="Ej.: molestia en un hombro"></label>
    <p class="tenue">Objetivo de ritmo: bajar ${fmt(pf.ritmoMin, 1)}–${fmt(pf.ritmoMax, 1)} kg por semana.</p>
  </div>`;

  h += `<div class="card">
    <div class="card-cab"><b class="crece">Cálculo de calorías</b></div>
    <p class="sub num">Con ${kg(peso)}: TMB (Mifflin-St Jeor) ${fmt(T)} kcal × ${fmt(pf.factor, 2)} = gasto ${fmt(G)} kcal.
    Menos ${fmt(pf.deficit)} de déficit = ${fmt(G - pf.deficit)} → ${fmt(abajo50(G - pf.deficit))}${S.ajusteKcal ? ` ${conSigno(S.ajusteKcal, 0)} de ajustes` : ""} = <b>${fmt(kc)} kcal</b>${kc === pf.piso ? " (piso)" : ""}.</p>
    <div class="tres-col">
      ${campoNum("Factor", "data-perfil", "factor", pf.factor, 'step="0.05"')}
      ${campoNum("Déficit", "data-perfil", "deficit", pf.deficit, 'step="50"')}
      <label class="campo"><span>Piso</span><input type="text" value="${fmt(pf.piso)} kcal" disabled></label>
    </div>
    <p class="tenue">El piso de ${fmt(pf.piso)} kcal es fijo: ninguna meta ni sugerencia baja de ahí.
    Las metas se recalculan solas cada 3 kg perdidos${S.pesoRefRecalculo != null ? ` (próximo aviso al llegar a ${kg(S.pesoRefRecalculo - 3)} de promedio)` : ""}.</p>
    <div class="botones"><button class="btn" data-act="recalcular-ya">Recalcular metas con mi peso actual</button></div>
  </div>`;

  h += `<div class="card">
    <div class="card-cab"><b class="crece">Metas diarias</b></div>
    <div class="dos-col">
      ${campoNum("Kcal", "data-meta", "kcal", m.kcal, `step="50" min="${pf.piso}"`)}
      ${campoNum("Proteína (g)", "data-meta", "p", m.p)}
      ${campoNum("Carbos (g)", "data-meta", "c", m.c)}
      ${campoNum("Grasa (g)", "data-meta", "g", m.g)}
    </div>
    <p class="tenue num" style="margin-top:8px">P×4 + C×4 + G×9 = ${fmt(sumaMacros)} kcal
    ${Math.abs(sumaMacros - m.kcal) > m.kcal * 0.05 ? `<span class="aviso-txt"> · no cuadra con ${fmt(m.kcal)}: revisa carbos o grasa</span>` : '<span class="bien"> · cuadra</span>'}</p>
    <div class="tres-col" style="margin-top:10px">
      ${campoNum("Agua (ml)", "data-meta", "aguaMl", m.aguaMl, 'step="250"')}
      ${campoNum("Pasos", "data-meta", "pasos", m.pasos, 'step="500"')}
      ${campoNum("Sueño (h)", "data-meta", "sueno", m.sueno, 'step="0.5"')}
    </div>
  </div>`;

  const nombresH = { desayuno: "Desayuno", almuerzo: "Almuerzo", snack: "Snack", cena: "Cena", entreno: "Entreno", postgym: "Post-gym", dormir: "Dormir" };
  h += `<div class="card"><div class="card-cab"><b class="crece">Horarios</b></div>
    <div class="dos-col">${Object.entries(nombresH).map(([k, v]) =>
      `<label class="campo"><span>${v}</span><input type="time" data-horario="${k}" value="${S.horarios[k]}"></label>`).join("")}</div>
  </div>`;

  h += `<div class="card"><details><summary>Historial de metas (${S.historialMetas.length})</summary>
    <ul class="lista">${[...S.historialMetas].reverse().map((x) => `<li><div class="crece">
      <div class="nom num">${fmt(x.kcal)} kcal · P ${x.p} · C ${x.c} · G ${x.g}</div>
      <div class="tenue">${esc(fechaDia(x.fecha))} · ${esc(x.motivo)}</div></div></li>`).join("")}</ul>
  </details></div>`;

  h += `<h2 class="titulo-sec">Tus datos en este celular</h2><div class="card">
    <p class="sub">Todo se guarda solo en este navegador. Si borras los datos del navegador o cambias de celular, se pierde: exporta una copia de vez en cuando.</p>
    <div class="botones"><button class="btn" data-act="exportar">Exportar copia</button><button class="btn" data-act="importar">Restaurar copia</button></div>
    <div class="botones"><button class="btn peligro fantasma" data-act="borrar-todo">Borrar todo</button></div>
  </div>
  <p class="tenue" style="text-align:center;margin-top:16px">MiCoach · ${AVISO_MEDICO}</p>`;
  return h;
}

/* ------------------------------- BIENVENIDA ------------------------------ */

function vistaBienvenida() {
  const logo = `<div class="logo"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><path d="M16 46V18l16 16 16-16v28" fill="none" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  if (bienvenida) {
    const { pf, T, G, metas } = bienvenida;
    const crudo = G - pf.deficit;
    const fechas = (meta) => {
      if (!meta || meta >= pf.pesoInicial) return "";
      const falta = pf.pesoInicial - meta, hoy = hoyISO();
      return `entre ${fechaMedia(sumarDias(hoy, Math.ceil((falta / pf.ritmoMax) * 7)))} y ${fechaMedia(sumarDias(hoy, Math.ceil((falta / pf.ritmoMin) * 7)))}`;
    };
    return `<div class="bienvenida">${logo}<h1>Tus metas</h1>
      <div class="card destacada">
        <div class="kcal-grande"><div class="cifra num">${fmt(metas.kcal)}</div><div class="lado"><b>kcal al día</b></div></div>
        <div class="tres-col num" style="margin-top:12px;text-align:center">
          <div><b style="color:var(--prot)">${metas.p} g</b><div class="tenue">proteína</div></div>
          <div><b style="color:var(--carb)">${metas.c} g</b><div class="tenue">carbos</div></div>
          <div><b style="color:var(--gras)">${metas.g} g</b><div class="tenue">grasa</div></div>
        </div>
      </div>
      <div class="card">
        <p class="sub num">TMB (Mifflin-St Jeor): ${fmt(T)} kcal<br>
        Gasto con actividad (× ${fmt(pf.factor, 2)}): ${fmt(G)} kcal<br>
        Déficit de ${fmt(pf.deficit)}: ${fmt(crudo)} → redondeado ${fmt(Math.max(pf.piso, abajo50(crudo)))} kcal${abajo50(crudo) < pf.piso ? ` (se aplicó el piso de ${fmt(pf.piso)})` : ""}<br>
        Proteína: 1.65 g por kg · grasa ≈ 26 % de las kcal · carbos, el resto.</p>
        <p class="sub">Ritmo esperado: ${fmt(pf.ritmoMin, 1)}–${fmt(pf.ritmoMax, 1)} kg por semana.
        ${pf.metaIntermedia ? `${kg(pf.metaIntermedia)}: ${fechas(pf.metaIntermedia)}.` : ""}
        ${pf.metaFinal ? ` ${kg(pf.metaFinal)}: ${fechas(pf.metaFinal)}.` : ""}</p>
        <p class="tenue">Todo se puede cambiar después en Perfil. La app sugiere ajustes según tu peso real.</p>
      </div>
      <div class="card aviso-medico"><b>Aviso:</b> ${AVISO_MEDICO}</div>
      <div class="botones"><button class="btn" data-act="bv-volver">Corregir datos</button><button class="btn prim grande" data-act="bv-ok">Empezar</button></div>
    </div>`;
  }
  return `<div class="bienvenida">${logo}<h1>Bienvenido a MiCoach</h1>
    <p class="sub">Tu dieta, tu entreno y tu progreso en el celular. Primero tus datos: se guardan solo en este navegador.</p>
    <div class="card aviso-medico"><b>Aviso:</b> ${AVISO_MEDICO}</div>
    <div class="card">
      <div class="seg" role="group" aria-label="Sexo">
        <button data-act="bv-sexo" data-v="hombre" aria-pressed="true">Hombre</button>
        <button data-act="bv-sexo" data-v="mujer" aria-pressed="false">Mujer</button>
      </div>
      <div class="dos-col" style="margin-top:12px">
        <label class="campo"><span>Edad</span><input type="number" inputmode="numeric" id="bv-edad" placeholder="años"></label>
        <label class="campo"><span>Altura (cm)</span><input type="number" inputmode="numeric" id="bv-altura" placeholder="cm"></label>
        <label class="campo"><span>Peso actual (kg)</span><input type="number" inputmode="decimal" step="0.1" id="bv-peso" placeholder="kg"></label>
        <span></span>
        <label class="campo"><span>Meta intermedia (kg)</span><input type="number" inputmode="decimal" step="0.1" id="bv-meta1" placeholder="opcional"></label>
        <label class="campo"><span>Meta final (kg)</span><input type="number" inputmode="decimal" step="0.1" id="bv-meta2" placeholder="kg"></label>
      </div>
      <div class="botones"><button class="btn prim grande" data-act="bv-calcular">Calcular mis metas</button></div>
    </div>
    <div class="card"><p class="sub">¿Ya usabas MiCoach en otro celular?</p>
      <button class="btn ancho" data-act="importar">Restaurar copia (.json)</button></div>
  </div>`;
}

function calcularBienvenida() {
  const v = (id) => num(document.getElementById(id).value);
  const sexo = document.querySelector('[data-act="bv-sexo"][aria-pressed="true"]')?.dataset.v || "hombre";
  const edad = v("bv-edad"), altura = v("bv-altura"), peso = v("bv-peso"), meta1 = v("bv-meta1"), meta2 = v("bv-meta2");
  if (edad == null || edad < 14 || edad > 90) return toast("Edad: entre 14 y 90 años.");
  if (altura == null || altura < 120 || altura > 230) return toast("Altura en centímetros, por ejemplo 170.");
  if (peso == null || peso < 35 || peso > 350) return toast("Revisa el peso.");
  if (meta2 == null || meta2 >= peso || meta2 < 35) return toast("La meta final tiene que ser menor que tu peso actual.");
  if (meta1 != null && (meta1 >= peso || meta1 <= meta2)) return toast("La meta intermedia va entre tu peso actual y la meta final.");
  const pf = { ...S.perfil, sexo, edad: Math.round(edad), altura, pesoInicial: peso, metaIntermedia: meta1, metaFinal: meta2 };
  const T = tmb(sexo, peso, altura, edad), G = T * pf.factor;
  const kcal = Math.max(pf.piso, abajo50(G - pf.deficit));
  bienvenida = { pf, T, G, metas: macrosPara(kcal, proteinaInicial(peso)) };
  render();
  window.scrollTo({ top: 0 });
}

const TABS = [["hoy", "Hoy"], ["dieta", "Dieta"], ["entreno", "Entreno"], ["progreso", "Progreso"], ["perfil", "Perfil"]];
const VISTAS = { hoy: vistaHoy, dieta: vistaDieta, entreno: vistaEntreno, progreso: vistaProgreso, perfil: vistaPerfil };

function pintarCabecera() {
  const cab = document.getElementById("cab");
  if (!S.perfil.listo) {
    cab.className = "top solo";
    cab.innerHTML = `<div class="tit"><b>MiCoach</b><span>Dieta y entreno</span></div>`;
    return;
  }
  const nombre = Object.fromEntries(TABS)[vista];
  if (vista === "hoy" || vista === "entreno") {
    const esHoy = fecha === hoyISO();
    cab.className = "top";
    cab.innerHTML = `
      <button class="flecha" data-act="fecha" data-v="-1" aria-label="Día anterior">‹</button>
      <div class="tit"><b>${esHoy ? nombre : `${nombre} · otro día`}</b><span>${esc(fechaLarga(fecha))}</span></div>
      <button class="flecha" data-act="fecha" data-v="1" aria-label="Día siguiente"${esHoy ? " disabled" : ""}>›</button>`;
  } else {
    cab.className = "top solo";
    cab.innerHTML = `<div class="tit"><b>${nombre}</b><span>MiCoach</span></div>`;
  }
}
function pintarNav() {
  const nav = document.getElementById("nav");
  nav.classList.toggle("oculto", !S.perfil.listo);
  nav.innerHTML = TABS.map(([id, nom]) =>
    `<button data-act="ir" data-v="${id}"${vista === id ? ' aria-current="page"' : ""}>${ICONOS[id]}<span>${nom}</span></button>`).join("");
}

let ultimoHoy = null;
function render() {
  graficos.clear();
  pintarCabecera();
  pintarNav();
  const app = document.getElementById("app");
  try {
    app.innerHTML = S.perfil.listo ? (VISTAS[vista] || vistaHoy)() : vistaBienvenida();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="card peligro"><h2>Algo se rompió al dibujar esta pantalla</h2>
      <p class="sub">${esc(e.message)}</p>
      <p class="sub">Exporta tus datos y recarga la página.</p>
      <div class="botones"><button class="btn" data-act="exportar">Exportar copia</button></div></div>`;
  }
  pintarGraficos();
}
function irA(v) {
  vista = v;
  if (v === "entreno") entDia = null;
  render();
  window.scrollTo({ top: 0 });
}

/** Lee un número de un input; si está vacío, usa su valor por defecto (data-def). */
const valorODef = (inp) => num(inp.value) ?? num(inp.dataset.def);

function marcarSerie(e, si) {
  const fila = document.querySelector(`.serie [data-act="serie-ok"][data-e="${e}"][data-s="${si}"]`).closest(".serie");
  const iP = fila.querySelector('[data-campo="peso"]'), iR = fila.querySelector('[data-campo="reps"]');
  const ses = asegurarSesion(fecha, entDia);
  const ej = ses.ejercicios[e], s = ej.series[si];
  if (s.hecho) return commit(() => { s.hecho = false; });
  const peso = valorODef(iP), reps = valorODef(iR);
  if (reps == null || reps <= 0) { toast(ej.unidad === "s" ? "Escribe los segundos." : "Escribe las reps."); return iR.focus(); }
  if (ej.unidad !== "s" && peso == null) { toast("Escribe el peso."); return iP.focus(); }
  commit(() => { s.peso = peso; s.reps = Math.round(reps); s.hecho = true; ses.terminado = false; });
  const quedan = ej.series.some((x) => !x.hecho) || ses.ejercicios.some((x) => x.series.some((y) => !y.hecho));
  if (quedan) iniciarDescanso(ej.descanso);
  pedirWakeLock();
}

function aplicarSugerencia() {
  const sug = sugerenciaKcal();
  if (!sug) return;
  const hoy = hoyISO();
  commit((S) => {
    if (sug.tipo === "mover") {
      S.metas.pasos = Math.max(S.metas.pasos, 10000);
      for (const d of Object.values(S.rutina)) if (d.cardio?.nombre === "Caminadora inclinada") { d.cardio.minMin += 10; d.cardio.minMax += 10; }
    } else {
      const motivo = `${sug.delta < 0 ? "No bajaba" : "Bajaba muy rápido"}: ${conSigno(sug.delta, 0)} kcal`;
      if (!fijarMetas(macrosPara(sug.kcal, S.metas.p), motivo)) return;
      S.ajusteKcal += sug.delta;
    }
    S.sugerencia.aplicadaEl = hoy;
  });
  toast("Ajuste aplicado. La próxima revisión, en 2 semanas.");
}
function aplicarRecalculo() {
  const rec = sugerenciaRecalculo();
  if (!rec) return;
  commit((S) => {
    if (fijarMetas(rec.nuevas, `Recalculado con ${kg(rec.peso)}`)) S.pesoRefRecalculo = r1(rec.peso);
  });
  toast("Metas recalculadas.");
}

function guardarPeso(f, valor) {
  const v = num(valor);
  if (v == null || v < 30 || v > 350) return toast("Ese peso no cuadra. Revisa el número.");
  commit((S) => { S.pesos[f] = Math.round(v * 100) / 100; });
  toast(`Peso guardado: ${kg(v)}.`);
}
function guardarPasos() {
  const inp = document.getElementById("dia-pasos");
  if (!inp) return;
  const v = num(inp.value);
  if (v != null && (v < 0 || v > 100000)) return toast("Revisa los pasos.");
  commit(() => { editarDia(fecha).pasos = v == null ? null : Math.round(v); });
}

const RANGOS_PERFIL = {
  edad: [14, 90], altura: [120, 230], pesoInicial: [35, 350], metaIntermedia: [35, 350], metaFinal: [35, 350],
  factor: [1.2, 1.9], deficit: [0, 1000], topeCompras: [0, 10000],
};
const RANGOS_META = { p: [40, 350], c: [0, 700], g: [20, 250], aguaMl: [500, 6000], pasos: [1000, 40000], sueno: [4, 12] };

function cambiarPerfil(k, valor) {
  if (k === "sexo" || k === "restriccion") return commit((S) => { S.perfil[k] = valor.trim ? valor.trim() : valor; });
  const v = num(valor);
  const [a, b] = RANGOS_PERFIL[k];
  if (v == null && (k === "metaIntermedia")) return commit((S) => { S.perfil[k] = null; });
  if (v == null || v < a || v > b) { toast(`Valor fuera de rango (${a}–${b}).`); return render(); }
  commit((S) => { S.perfil[k] = k === "edad" ? Math.round(v) : v; });
}
function cambiarMeta(k, valor) {
  const v = num(valor);
  if (k === "kcal") {
    if (v == null || v > 6000) { toast("Revisa las kcal."); return render(); }
    commit((S) => { fijarMetas({ kcal: Math.round(v) }, "Edición manual"); });
    return;
  }
  const [a, b] = RANGOS_META[k];
  if (v == null || v < a || v > b) { toast(`Valor fuera de rango (${a}–${b}).`); return render(); }
  if (k in { p: 1, c: 1, g: 1 }) return commit(() => { fijarMetas({ [k]: Math.round(v) }, "Edición manual"); });
  commit((S) => { S.metas[k] = v; });
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  const c = b.dataset.c;
  const hoy = hoyISO();

  switch (b.dataset.act) {
    case "ir": return irA(b.dataset.v);
    case "fecha": {
      const nueva = sumarDias(fecha, +b.dataset.v);
      if (nueva > hoy) return;
      fecha = nueva; entDia = null; terminarDescanso(false);
      return render();
    }
    case "ir-hoy": fecha = hoy; entDia = null; return render();

    /* Hoy: comidas */
    case "comida-ok":
      return commit(() => { editarDia(fecha).comidas[c] = { estado: "comido", items: clonar(planDe(fecha)[c] || []) }; });
    case "comida-saltar":
      return commit(() => { editarDia(fecha).comidas[c] = { estado: "saltado", items: [] }; });
    case "comida-deshacer":
      return commit(() => { delete editarDia(fecha).comidas[c]; });
    case "comida-cambiar": {
      const r = leerDia(fecha).comidas[c];
      const base = r?.estado === "comido" ? r.items : planDe(fecha)[c] || [];
      return abrirEditor({ tipo: "hoy", fecha, comida: c }, base, `${COMIDAS.find((x) => x.id === c).nombre} · ${fechaDia(fecha)}`);
    }
    case "extras": return abrirEditor({ tipo: "extra", fecha }, leerDia(fecha).extras, `Extras · ${fechaDia(fecha)}`);
    case "verdura-mas":
      commit(() => { editarDia(fecha).extras.push({ a: "ensalada", c: 1 }); });
      return toast("+1 porción de verdura (ensalada). Cámbiala en Extras si fue otra.");

    /* Hoy: hábitos */
    case "agua": return commit(() => { const d = editarDia(fecha); d.aguaMl = Math.max(0, d.aguaMl + +b.dataset.v); });
    case "supl": {
      if (id === "zinc" && !tomoZinc(fecha) && !zincPermitido(fecha)) return toast("Zinc bloqueado: máximo 3 veces en 7 días.");
      return commit(() => { const d = editarDia(fecha); d.supl[id] = !d.supl[id]; });
    }
    case "cardio": {
      const r = rutinaDe(b.dataset.dia || claveDia(fecha));
      return commit(() => { const d = editarDia(fecha); d.cardio = d.cardio?.hecho ? null : { hecho: true, min: r.cardio?.minMax || null }; });
    }
    case "sueno": return commit(() => {
      const d = editarDia(fecha);
      d.sueno = Math.min(14, Math.max(0, (d.sueno ?? 7) + +b.dataset.v));
    });
    case "pasos-guardar": return guardarPasos();
    case "peso-dia": return guardarPeso(fecha, document.getElementById("dia-peso").value);

    /* Sugerencias */
    case "sug-aplicar": return aplicarSugerencia();
    case "sug-descartar": return commit((S) => { S.sugerencia.descartadaEl = hoy; });
    case "recalc-aplicar": return aplicarRecalculo();
    case "recalc-descartar": return commit((S) => { S.sugerencia.recalcDescartadaEl = hoy; });

    /* Dieta */
    case "dieta-tab": dietaTab = b.dataset.v; busqueda = { texto: "", grupo: "todos" }; return render();
    case "plan-dia": dietaDia = b.dataset.v; return render();
    case "plan-editar":
      return abrirEditor({ tipo: "plan", dia: b.dataset.dia, comida: c }, S.plan[b.dataset.dia][c],
        `${COMIDAS.find((x) => x.id === c).nombre} · ${DIA_NOMBRE[b.dataset.dia]}`);
    case "copiar-dia": return dlgCopiarDia(b.dataset.dia);
    case "copiar-dia-ok": {
      const destinos = [...document.querySelectorAll(".copiar-a:checked")].map((x) => x.value);
      if (!destinos.length) return toast("Elige al menos un día.");
      commit((S) => { for (const d of destinos) S.plan[d] = clonar(S.plan[b.dataset.dia]); });
      cerrarDlg();
      return toast(`Copiado a ${destinos.length} día${destinos.length === 1 ? "" : "s"}.`);
    }
    case "plan-reset":
      if (!confirm("Se reemplaza todo tu plan semanal por el plan base. ¿Seguir?")) return;
      commit((S) => { S.plan = planBase(); });
      return toast("Plan restablecido.");
    case "grupo-alim": busqueda.grupo = b.dataset.v; return render();
    case "grupo-ed": busqueda.grupo = b.dataset.v; return pintarBuscador();
    case "ver-alim": return dlgAlimento(id);
    case "alim-nuevo": return dlgAlimentoPropio(null);
    case "alim-editar": return dlgAlimentoPropio(id);
    case "alim-guardar": return guardarAlimentoPropio(id || null);
    case "alim-borrar": {
      const uso = alimentoEnUso(id);
      if (uso) return toast(uso);
      if (!confirm("¿Borrar este alimento?")) return;
      commit((S) => { S.alimentosPropios = S.alimentosPropios.filter((x) => x.id !== id); });
      return cerrarDlg();
    }
    case "ver-intercambio": intercambioId = id; dietaTab = "intercambios"; cerrarDlg(); return irA("dieta");
    case "comprado": {
      const sem = lunesDe(hoy);
      return commit((S) => {
        const set = new Set(S.compradas[sem] || []);
        if (set.has(id)) set.delete(id); else set.add(id);
        S.compradas = { [sem]: [...set] };   // solo se guarda la semana en curso
      });
    }
    case "compras-desmarcar": return commit((S) => { S.compradas = {}; });

    /* Editor de comidas */
    case "ed-mas": case "ed-menos": {
      const it = editor.items[+b.dataset.i];
      const sube = b.dataset.act === "ed-mas";
      const paso = sube ? (it.c < 1 ? 0.25 : 0.5) : (it.c <= 1 ? 0.25 : 0.5);
      it.c = Math.max(0.25, Math.round((it.c + (sube ? paso : -paso)) * 100) / 100);
      return pintarEditor();
    }
    case "ed-quitar": editor.items.splice(+b.dataset.i, 1); return pintarEditor();
    case "ed-cambio": editor.modo = "cambio"; editor.i = +b.dataset.i; return pintarEditor();
    case "ed-cambio-ok": editor.items[editor.i] = { a: id, c: +b.dataset.c }; editor.modo = "lista"; return pintarEditor();
    case "ed-modo": editor.modo = b.dataset.v; if (b.dataset.v === "buscar") busqueda = { texto: "", grupo: "todos" }; return pintarEditor();
    case "ed-volver": editor.modo = "lista"; return pintarEditor();
    case "ed-agregar": editor.items.push({ a: id, c: 1 }); editor.modo = "lista"; return pintarEditor();
    case "ed-manual-ok": {
      const v = (k) => num(document.getElementById(k).value);
      const nombre = document.getElementById("man-nombre").value.trim();
      const kcal = v("man-kcal");
      if (!nombre || kcal == null) return toast("Pon al menos qué fue y las kcal.");
      editor.items.push({ m: { nombre, kcal, p: v("man-p") ?? 0, c: v("man-c") ?? 0, g: v("man-g") ?? 0 } });
      editor.modo = "lista";
      return pintarEditor();
    }
    case "ed-guardar": return guardarEditor();
    case "cerrar": return cerrarDlg();

    /* Entreno */
    case "ent-dia": entDia = b.dataset.v; return render();
    case "serie-ok": return marcarSerie(+b.dataset.e, +b.dataset.s);
    case "serie-mas":
      return commit(() => { asegurarSesion(fecha, entDia).ejercicios[+b.dataset.e].series.push(...seriesVacias(1)); });
    case "serie-menos": {
      const ej = asegurarSesion(fecha, entDia).ejercicios[+b.dataset.e];
      if (ej.series[ej.series.length - 1].hecho) return toast("La última serie ya está hecha: desmárcala primero.");
      return commit(() => { ej.series.pop(); });
    }
    case "ent-terminar": {
      if (!entrenoHecho(fecha)) return toast("Marca al menos una serie primero.");
      commit((S) => { S.sesiones[fecha].terminado = true; });
      terminarDescanso(false);
      soltarWakeLock();
      return toast(`Entreno registrado: ${plural(seriesHechas(fecha), "serie", "series")}. Ahora, tu post-gym.`);
    }
    case "dolio-abrir": return dlgDolio(+b.dataset.i);
    case "dolio": return aplicarDolio(+b.dataset.i, b.dataset.modo);
    case "timer-mas": return ajustarDescanso(+b.dataset.v);
    case "timer-fin": return terminarDescanso(false);

    /* Rutina */
    case "rut-abrir": return dlgRutina(b.dataset.dia);
    case "rut-subir": {
      const i = +b.dataset.i, dia = b.dataset.dia;
      commit((S) => { const l = S.rutina[dia].ejercicios; [l[i - 1], l[i]] = [l[i], l[i - 1]]; });
      return dlgRutina(dia);
    }
    case "rut-editar": return dlgEjercicio(b.dataset.dia, b.dataset.i);
    case "rut-borrar": {
      const dia = b.dataset.dia, i = +b.dataset.i;
      if (!confirm(`¿Quitar "${S.rutina[dia].ejercicios[i].nombre}" de la rutina?`)) return;
      commit((S) => { S.rutina[dia].ejercicios.splice(i, 1); });
      return dlgRutina(dia);
    }
    case "rut-reset": {
      const dia = b.dataset.dia;
      if (!confirm(`¿Volver el ${DIA_NOMBRE[dia].toLowerCase()} a la rutina base?`)) return;
      commit((S) => { S.rutina[dia] = rutinaBase()[dia]; });
      return dlgRutina(dia);
    }
    case "rut-volver": return dlgRutina(document.getElementById("ej-dia").value);
    case "ej-guardar": return guardarEjercicio();

    /* Progreso */
    case "rango-peso": rangoPeso = +b.dataset.v; return render();
    case "guardar-peso": {
      const f = document.getElementById("reg-fecha").value || hoy;
      if (f > hoy) return toast("No se registra el futuro.");
      return guardarPeso(f, document.getElementById("reg-peso").value);
    }
    case "guardar-cintura": {
      const f = document.getElementById("reg-fecha").value || hoy;
      const v = num(document.getElementById("reg-cintura").value);
      if (v == null || v < 40 || v > 250) return toast("Revisa la medida de cintura.");
      commit((S) => { S.cintura[f] = v; });
      return toast(`Cintura guardada: ${fmt(v, 1)} cm.`);
    }
    case "peso-borrar":
      if (!confirm(`¿Borrar el pesaje del ${fechaCorta(id)}?`)) return;
      return commit((S) => { delete S.pesos[id]; });
    case "cintura-borrar":
      if (!confirm(`¿Borrar la medida del ${fechaCorta(id)}?`)) return;
      return commit((S) => { delete S.cintura[id]; });

    /* Perfil */
    case "copiar-resumen": return copiarTexto(resumenSemanal());
    case "compartir":
      return navigator.share?.({ title: "Resumen semanal · MiCoach", text: resumenSemanal() }).catch(() => {});
    case "recalcular-ya": {
      const p = pesoActual();
      const nuevas = macrosPara(kcalCalculadas(p), S.metas.p);
      if (!confirm(`Metas con ${kg(p)}: ${fmt(nuevas.kcal)} kcal · P ${nuevas.p} · C ${nuevas.c} · G ${nuevas.g}. ¿Aplicar?`)) return;
      commit((S) => { if (fijarMetas(nuevas, `Recalculado con ${kg(p)}`)) S.pesoRefRecalculo = r1(p); });
      return toast("Metas recalculadas.");
    }
    case "exportar": return exportarJSON();
    case "importar": return document.getElementById("file-import").click();
    case "borrar-todo":
      if (!confirm("Se borrarán TODOS tus datos de este navegador. ¿Seguro?")) return;
      if (!confirm("Última confirmación: no se puede deshacer. ¿Borrar todo?")) return;
      clearTimeout(guardarTimer);
      try { localStorage.removeItem(CLAVE); } catch { /* nada que borrar */ }
      S = estadoInicial();
      arrancar(false);
      return toast("Todo borrado.");

    /* Bienvenida */
    case "bv-sexo":
      document.querySelectorAll('[data-act="bv-sexo"]').forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      return;
    case "bv-calcular": return calcularBienvenida();
    case "bv-volver": bienvenida = null; return render();
    case "bv-ok": {
      const { pf, metas } = bienvenida;
      commit((S) => {
        S.perfil = { ...pf, listo: true };
        fijarMetas(metas, "Inicio");
        S.pesoRefRecalculo = pf.pesoInicial;
        if (S.pesos[hoy] == null) S.pesos[hoy] = pf.pesoInicial;
        bienvenida = null;
        vista = "hoy";
      });
      return toast("Listo. Arranca registrando tu desayuno.");
    }
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "file-import") { if (t.files?.[0]) importarJSON(t.files[0]); t.value = ""; return; }
  if (t.id === "dia-pasos") return guardarPasos();
  if (t.id === "dia-nota") { editarDia(fecha).nota = t.value; return guardar(); }
  if (t.dataset.campo && t.closest(".serie")) {
    // Guardar lo escrito sin repintar, para no perder el foco mientras llenas la serie.
    const s = asegurarSesion(fecha, entDia).ejercicios[+t.dataset.e].series[+t.dataset.s];
    s[t.dataset.campo] = num(t.value);
    return guardar();
  }
  if (t.dataset.precio) {
    const v = num(t.value);
    if (v == null || v < 0) return render();
    return commit((S) => { S.precios[t.dataset.precio] = v; });
  }
  if (t.id === "tope-compras") return cambiarPerfil("topeCompras", t.value);
  if (t.id === "sel-intercambio") { intercambioId = t.value; return render(); }
  if (t.dataset.perfil) return cambiarPerfil(t.dataset.perfil, t.value);
  if (t.dataset.meta) return cambiarMeta(t.dataset.meta, t.value);
  if (t.dataset.horario) return commit((S) => { if (t.value) S.horarios[t.dataset.horario] = t.value; });
  if (t.id === "rut-nombre") return commit((S) => { S.rutina[t.dataset.dia].nombre = t.value.trim() || "Sin nombre"; });
  if (t.id === "rut-cardio" || t.id === "rut-cmin" || t.id === "rut-cmax") {
    const dia = t.dataset.dia;
    const nombre = document.getElementById("rut-cardio").value.trim();
    const a = Math.round(num(document.getElementById("rut-cmin").value) || 15);
    const b = Math.max(a, Math.round(num(document.getElementById("rut-cmax").value) || a));
    if (nombre && prohibido(nombre)) return toast("Ese movimiento está bloqueado por cuidado de hombro.");
    return commit((S) => { S.rutina[dia].cardio = nombre ? { nombre, minMin: a, minMax: b } : null; });
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "buscar") {
    busqueda.texto = t.value;
    const cont = document.getElementById(t.dataset.res);
    if (cont) cont.innerHTML = resultadosBusqueda(t.dataset.resAct);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  const t = ev.target;
  if (t.id === "dia-pasos" || t.id === "dia-peso" || t.id === "reg-peso") { ev.preventDefault(); t.blur(); }
  if (t.id === "dia-peso") guardarPeso(fecha, t.value);
  if (t.id === "reg-peso") document.querySelector('[data-act="guardar-peso"]')?.click();
});

dlg().addEventListener("click", (ev) => { if (ev.target === dlg()) cerrarDlg(); });
dlg().addEventListener("close", () => { editor = null; });

// Si la app queda abierta de un día para otro, al volver salta a la fecha nueva.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !S) return;
  const hoy = hoyISO();
  if (ultimoHoy && hoy !== ultimoHoy) {
    if (fecha === ultimoHoy) { fecha = hoy; entDia = null; }
    ultimoHoy = hoy;
    render();
  }
});

function arrancar(desdeAlmacen = true) {
  if (desdeAlmacen && !cargar()) S = estadoInicial();
  fecha = hoyISO();
  ultimoHoy = fecha;
  vista = "hoy";
  entDia = null;
  dietaDia = null;
  bienvenida = null;
  render();
}

arrancar();
cargarChart();
</script>
</body>
