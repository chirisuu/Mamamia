<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiCoach — Dieta y entreno</title>
<meta name="description" content="Tu dieta, tu rutina, tus suplementos y tu progreso en un solo archivo, con resumen semanal para tu coach.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiCoach">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231baf7a'/%3E%3Cpath d='M16 46V18l16 16 16-16v28' fill='none' stroke='%230d0d0d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   TOKENS — misma paleta oscura validada que Mamamía
   Superficie #1a1a19 sobre plano #0d0d0d
   ============================================================ */
:root {
  color-scheme: dark;
  --plano:        #0d0d0d;
  --superficie:   #1a1a19;
  --superficie-2: #232322;
  --superficie-3: #2c2c2a;
  --tinta:        #ffffff;
  --tinta-2:      #c3c2b7;
  --tinta-3:      #898781;
  --linea:        #2c2c2a;
  --borde:        rgba(255,255,255,.12);

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;

  --acento:     #1baf7a;   /* botón principal: texto oscuro encima */
  --acento-txt: #3dd39b;
  --bien:       #0ca30c;
  --bien-txt:   #3cc13c;
  --aviso:      #fab219;
  --grave:      #ec835a;
  --critico:    #d03b3b;
  --critico-txt:#f07070;

  --prot: var(--s1);
  --carb: var(--s4);
  --gras: var(--s5);

  --r: 14px;
  --nav-h: 64px;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; }
body {
  background: var(--plano);
  color: var(--tinta);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
h1,h2,h3 { margin:0; line-height:1.25; font-weight:650; letter-spacing:-.01em; }
h1 { font-size:1.15rem; }
h2 { font-size:1.05rem; }
h3 { font-size:.95rem; }
p { margin:0 0 .5em; }
button, input, select, textarea { font: inherit; color: inherit; }
:where(button, input, select, textarea, [tabindex], a):focus-visible {
  outline: 2px solid var(--acento-txt); outline-offset: 2px; border-radius: 8px;
}
.oculto { display:none !important; }
.num { font-variant-numeric: tabular-nums; }
.sub { color: var(--tinta-2); font-size:.85rem; }
.tenue { color: var(--tinta-3); font-size:.8rem; }
.bien { color: var(--bien-txt); }
.aviso-txt { color: var(--aviso); }
.malo { color: var(--critico-txt); }
.crece { flex:1 1 auto; min-width:0; }
.der { text-align:right; }

/* ---- Cabecera ---- */
header.top {
  position: sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:.4rem;
  padding: calc(.45rem + env(safe-area-inset-top)) 16px .45rem;
  background: color-mix(in srgb, var(--plano) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--linea);
  min-height: 56px;
}
header.top .tit { flex:1 1 auto; min-width:0; text-align:center; }
header.top .tit b { display:block; font-size:1.05rem; }
header.top .tit span { display:block; font-size:.8rem; color:var(--tinta-2); }
header.top .tit span::first-letter { text-transform:uppercase; }
header.top.solo .tit { text-align:left; }
.flecha {
  width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--borde);
  background: var(--superficie); cursor:pointer; font-size:1.3rem; line-height:1;
}
.flecha:disabled { opacity:.35; }

main {
  padding: 12px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
}

/* ---- Barra inferior ---- */
nav.abajo {
  position: fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background: var(--superficie);
  border-top: 1px solid var(--borde);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.abajo button {
  flex:1 1 0; min-height: var(--nav-h); border:0; background:transparent; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color: var(--tinta-3); font-size:.74rem; font-weight:550;
}
nav.abajo svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
nav.abajo button[aria-current="page"] { color: var(--acento-txt); font-weight:700; }

/* ---- Tarjetas ---- */
.card {
  background: var(--superficie); border:1px solid var(--borde);
  border-radius: var(--r); padding: 14px; box-shadow: var(--sombra);
}
.card + .card, .card + .grupo, .grupo + .card, .seg + .card, .card + .seg, .chips + .card { margin-top: 12px; }
.card-cab { display:flex; align-items:baseline; gap:.5rem; margin-bottom:.6rem; flex-wrap:wrap; }
.card-cab .crece { flex:1 1 auto; }
.card.destacada { border-color: color-mix(in srgb, var(--acento) 55%, transparent); }
.card.alerta { border-color: color-mix(in srgb, var(--aviso) 60%, transparent); }
.card.peligro { border-color: color-mix(in srgb, var(--critico) 60%, transparent); }
.titulo-sec { margin: 22px 2px 8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--tinta-3); font-weight:700; }

/* ---- Botones ---- */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  min-height:48px; padding: 0 16px; border-radius:12px; cursor:pointer;
  border:1px solid var(--borde); background: var(--superficie-2); color: var(--tinta);
  font-weight:600; font-size:1rem; text-align:center; line-height:1.2;
}
.btn:active { transform: scale(.98); }
.btn.prim { background: var(--acento); border-color: var(--acento); color:#0b0b0b; }
.btn.peligro { color: var(--critico-txt); }
.btn.fantasma { background:transparent; }
.btn.chico { min-height:40px; padding:0 12px; font-size:.9rem; border-radius:10px; }
.btn.ancho { width:100%; }
.btn.grande { min-height:56px; font-size:1.05rem; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.botones { display:flex; gap:8px; margin-top:12px; }
.botones > .btn { flex:1 1 0; }
.botones.envolver { flex-wrap:wrap; }
.icono-btn {
  width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--borde);
  background: var(--superficie-2); cursor:pointer; font-size:1.1rem; display:inline-flex; align-items:center; justify-content:center;
}

/* ---- Chips y segmentos ---- */
.chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0 4px; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex:none; min-height:40px; padding:0 14px; border-radius:99px; cursor:pointer;
  border:1px solid var(--borde); background: var(--superficie); color: var(--tinta-2); font-weight:600; font-size:.9rem;
}
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--plano); border-color: var(--tinta); }
.chip.hecho::after { content:" ✓"; color: var(--acento-txt); }
.chip[aria-pressed="true"].hecho::after { color: var(--s3); }
.seg { display:flex; background: var(--superficie); border:1px solid var(--borde); border-radius:12px; padding:3px; gap:3px; }
.seg button {
  flex:1 1 0; min-height:42px; border:0; border-radius:9px; background:transparent; cursor:pointer;
  color: var(--tinta-2); font-weight:600; font-size:.9rem;
}
.seg button[aria-pressed="true"] { background: var(--superficie-3); color: var(--tinta); }

/* ---- Formularios ---- */
label.campo { display:block; margin-bottom:10px; }
label.campo > span { display:block; font-size:.82rem; color: var(--tinta-2); margin-bottom:4px; font-weight:550; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
  width:100%; min-height:48px; padding: 10px 12px; border-radius:12px;
  border:1px solid var(--borde); background: var(--superficie-2); font-size:16px;
}
textarea { min-height:84px; resize:vertical; }
input::placeholder, textarea::placeholder { color: var(--tinta-3); }
.dos-col { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.tres-col { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
.dos-col label.campo, .tres-col label.campo { margin-bottom:0; }
.fila-input { display:flex; gap:8px; align-items:stretch; }
.fila-input input { flex:1 1 auto; min-width:0; }

/* ---- Barras de progreso ---- */
.barra-prog { height:10px; border-radius:99px; background: var(--superficie-3); overflow:hidden; }
.barra-prog > i { display:block; height:100%; border-radius:99px; background: var(--acento); max-width:100%; }
.macro { margin-top:10px; }
.macro .linea { display:flex; justify-content:space-between; font-size:.88rem; margin-bottom:4px; }
.macro .linea b { font-weight:650; }

/* ---- HOY: kcal grandes ---- */
.kcal-grande { display:flex; align-items:flex-end; gap:10px; }
.kcal-grande .cifra { font-size:3.1rem; font-weight:750; letter-spacing:-.03em; line-height:1; }
.kcal-grande .cifra.malo { color: var(--critico-txt); }
.kcal-grande .lado { padding-bottom:4px; }

/* ---- Comidas ---- */
.comida .cab { display:flex; align-items:center; gap:8px; }
.comida .cab .hora { font-size:.8rem; color: var(--tinta-3); }
.comida .items { margin:6px 0 0; padding:0; list-style:none; font-size:.9rem; color: var(--tinta-2); }
.comida .items li { padding:2px 0; }
.comida.hecha { opacity:.92; border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
.comida.saltada { opacity:.6; }
.etq {
  display:inline-block; padding:2px 8px; border-radius:99px; font-size:.72rem; font-weight:700;
  background: var(--superficie-3); color: var(--tinta-2); white-space:nowrap;
}
.etq.ok { background: color-mix(in srgb, var(--acento) 25%, transparent); color: var(--acento-txt); }
.etq.ahora { background: color-mix(in srgb, var(--aviso) 25%, transparent); color: var(--aviso); }
.etq.mal { background: color-mix(in srgb, var(--critico) 25%, transparent); color: var(--critico-txt); }

/* ---- Listas ---- */
.lista { list-style:none; margin:0; padding:0; }
.lista > li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--linea); }
.lista > li:first-child { border-top:0; }
.lista .nom { font-weight:600; }
.lista .det { font-size:.8rem; color: var(--tinta-3); }
.fila-boton {
  width:100%; display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer;
  background:transparent; border:0; padding:10px 0; min-height:52px;
}

/* ---- Toggles (suplementos, cardio) ---- */
.toggle {
  width:100%; display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left;
  min-height:56px; padding:8px 10px; border-radius:12px; border:1px solid var(--borde);
  background: var(--superficie-2); margin-top:8px;
}
.toggle .caja {
  width:28px; height:28px; flex:none; border-radius:8px; border:2px solid var(--tinta-3);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:#0b0b0b;
}
.toggle[aria-pressed="true"] { border-color: color-mix(in srgb, var(--acento) 55%, transparent); }
.toggle[aria-pressed="true"] .caja { background: var(--acento); border-color: var(--acento); }
.toggle[aria-pressed="true"] .caja::after { content:"✓"; }
.toggle:disabled { opacity:.55; cursor:not-allowed; }
.toggle:disabled .caja::after { content:"🔒"; font-size:.8rem; }

/* ---- Agua ---- */
.vasos { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 2px; }
.vasos i { width:18px; height:24px; border-radius:3px 3px 6px 6px; border:2px solid var(--s1); }
.vasos i.lleno { background: var(--s1); }

/* ---- KPIs ---- */
.kpis { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.kpi { background: var(--superficie); border:1px solid var(--borde); border-radius: var(--r); padding:12px; }
.kpi .et { font-size:.78rem; color: var(--tinta-2); }
.kpi .va { font-size:1.45rem; font-weight:700; letter-spacing:-.02em; }
.kpi .pi { font-size:.78rem; color: var(--tinta-3); }

/* ---- ENTRENO ---- */
.ejercicio .cab { display:flex; align-items:flex-start; gap:8px; }
.ejercicio .rango { font-size:.85rem; color: var(--tinta-2); }
.ejercicio .anterior { font-size:.8rem; color: var(--tinta-3); margin-top:4px; }
.ejercicio .consejo { font-size:.85rem; margin-top:6px; padding:8px 10px; border-radius:10px; background: var(--superficie-2); }
.ejercicio .consejo.sube { background: color-mix(in srgb, var(--acento) 18%, transparent); color: var(--acento-txt); font-weight:600; }
.serie { display:grid; grid-template-columns: 34px 1fr 1fr 52px; gap:8px; align-items:center; margin-top:8px; }
.serie .n { font-weight:700; color: var(--tinta-3); text-align:center; }
.serie input { text-align:center; font-size:1.1rem; font-weight:650; min-height:52px; padding:6px; }
.serie .ok {
  height:52px; border-radius:12px; border:1px solid var(--borde); background: var(--superficie-2);
  font-size:1.4rem; cursor:pointer; color: var(--tinta-3);
}
.serie.hecha .ok { background: var(--acento); border-color: var(--acento); color:#0b0b0b; }
.serie.hecha input { border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
.cols-serie { display:grid; grid-template-columns: 34px 1fr 1fr 52px; gap:8px; font-size:.72rem; color: var(--tinta-3); text-align:center; margin-top:10px; text-transform:uppercase; letter-spacing:.05em; }
.dolio { color: var(--grave); }
.etq.hombro { background: color-mix(in srgb, var(--grave) 22%, transparent); color: var(--grave); }

/* ---- Temporizador ---- */
#timer {
  position: fixed; left:12px; right:12px; z-index:45;
  bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));
  max-width: 616px; margin: 0 auto;
  background: var(--superficie-3); border:1px solid var(--borde); border-radius:16px;
  box-shadow: 0 8px 30px rgba(0,0,0,.6); padding:10px 12px;
  display:flex; align-items:center; gap:10px;
}
#timer .t { font-size:2rem; font-weight:750; font-variant-numeric: tabular-nums; min-width:4.2ch; }
#timer .barra-prog { flex:1 1 auto; }
#timer .icono-btn { width:48px; height:48px; font-size:.9rem; font-weight:700; }

/* ---- Gráficos ---- */
.lienzo { position:relative; height:230px; }
.lienzo.bajo { height:180px; }
.lienzo .sin-graf {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
  padding:16px; color: var(--tinta-3); font-size:.88rem; border:1px dashed var(--borde); border-radius:12px;
}

/* ---- Tablas ---- */
table.tabla { width:100%; border-collapse:collapse; font-size:.88rem; }
.tabla th, .tabla td { padding:8px 4px; border-top:1px solid var(--linea); text-align:left; vertical-align:middle; }
.tabla th { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color: var(--tinta-3); border-top:0; font-weight:700; }
.tabla td.n, .tabla th.n { text-align:right; font-variant-numeric: tabular-nums; }
.tabla input { min-height:40px; padding:6px 8px; text-align:right; font-size:16px; }
.tabla tr.comprado td { opacity:.5; text-decoration: line-through; }
.tabla tr.comprado td:first-child, .tabla tr.comprado td:last-child { text-decoration:none; }

/* ---- Diálogo ---- */
dialog#dlg {
  width: min(100vw, 640px); max-width:100vw; max-height: 92dvh; margin: auto auto 0;
  padding:0; border:1px solid var(--borde); border-radius: 18px 18px 0 0;
  background: var(--superficie); color: var(--tinta);
}
dialog#dlg::backdrop { background: rgba(0,0,0,.65); }
.dlg-cuerpo { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.dlg-cab { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.dlg-cab h2 { flex:1 1 auto; }
.resultados { max-height: 42dvh; overflow:auto; margin-top:8px; }
.editor-item { display:grid; grid-template-columns: 1fr auto; gap:6px; padding:10px 0; border-top:1px solid var(--linea); }
.editor-item:first-child { border-top:0; }
.paso { display:flex; align-items:center; gap:6px; }
.paso .v { min-width:3.2ch; text-align:center; font-weight:700; }
.paso .icono-btn { width:40px; height:40px; }
pre.resumen {
  white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--superficie-2); border-radius:12px; padding:12px; margin:0; max-height: 50dvh; overflow:auto;
}

/* ---- Toast ---- */
#toast {
  position: fixed; left:50%; transform: translateX(-50%) translateY(-12px);
  top: calc(64px + env(safe-area-inset-top));
  background: var(--tinta); color: var(--plano); padding:10px 16px; border-radius:12px;
  font-weight:600; font-size:.92rem; opacity:0; pointer-events:none; transition: .2s;
  z-index:60; max-width: calc(100vw - 32px); text-align:center;
}
#toast.ver { opacity:1; transform: translateX(-50%) translateY(0); }

/* ---- Bienvenida ---- */
.bienvenida h1 { font-size:1.6rem; margin: 18px 0 6px; }
.bienvenida .logo {
  width:56px; height:56px; border-radius:16px; background: var(--acento); display:flex; align-items:center; justify-content:center;
}
.aviso-medico {
  border-left: 4px solid var(--aviso); background: color-mix(in srgb, var(--aviso) 10%, var(--superficie));
}
details > summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; }
</style>
</head>
<body>
<header class="top" id="cab"></header>
<main id="app" aria-live="polite"></main>
<nav class="abajo" id="nav" aria-label="Secciones"></nav>
<div id="timer" class="oculto" role="timer" aria-live="off"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<input type="file" id="file-import" accept="application/json,.json" class="oculto">

<script>
"use strict";
/* ============================================================================
   §1 · ESTADO Y PERSISTENCIA
   ========================================================================== */

const CLAVE = "micoach.v1";
const LOCALE = "es-PE";
const ESQUEMA = 1;
const CHART_URL = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js";
const CHART_SRI = "sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG";

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clonar = (x) => JSON.parse(JSON.stringify(x));

/**
 * El estado arranca con una plantilla neutra: el perfil personal (edad, peso,
 * metas de peso) se pide en la bienvenida y vive solo en este navegador.
 * Lo genérico —factor de actividad, déficit, piso, plan, rutina— sí viene puesto.
 */
function estadoInicial() {
  return {
    version: ESQUEMA,
    perfil: {
      listo: false, sexo: "hombre", edad: null, altura: null, pesoInicial: null,
      factor: 1.45, deficit: 800, piso: 1800,
      metaIntermedia: null, metaFinal: null, ritmoMin: 0.8, ritmoMax: 1.0,
      restriccion: "", topeCompras: 200,
    },
    metas: { kcal: 2000, p: 150, c: 200, g: 60, aguaMl: 3000, pasos: 8000, sueno: 7.5 },
    horarios: {
      desayuno: "07:30", almuerzo: "13:00", snack: "16:30", cena: "19:15",
      entreno: "21:00", postgym: "22:15", dormir: "23:30",
    },
    plan: planBase(),
    rutina: rutinaBase(),
    dias: {},              // "YYYY-MM-DD" → registro del día
    sesiones: {},          // "YYYY-MM-DD" → sesión de entreno
    pesos: {},             // "YYYY-MM-DD" → kg
    cintura: {},           // "YYYY-MM-DD" → cm
    precios: {},           // clave de compra → S/ por unidad (solo los que cambiaste)
    compradas: {},         // lunes ISO → [claves marcadas como compradas]
    alimentosPropios: [],
    molestias: [],         // registros del botón "Me dolió"
    historialMetas: [],    // { fecha, kcal, p, c, g, motivo }
    pesoRefRecalculo: null,
    ajusteKcal: 0,         // suma de los ±150 aplicados, se respeta al recalcular
    sugerencia: { aplicadaEl: null, descartadaEl: null, recalcDescartadaEl: null },
  };
}

let S = null;                     // se llena en arrancar(): estadoInicial() usa constantes de §2 y §3
let vista = "hoy";
let fecha = null;                 // día que se ve en Hoy y Entreno
let dietaTab = "plan";
let dietaDia = null;

/**
 * Normaliza un estado guardado. Fusiona por clave con el estado inicial: una
 * copia anterior a la que le falte algo se completa con los valores por defecto
 * en lugar de romper la app o perder lo que sí traía.
 */
function migrar(datos) {
  if (!datos || typeof datos !== "object" || !datos.version) return null;
  const base = estadoInicial();
  const out = { ...base, ...datos, version: ESQUEMA };
  for (const k of ["perfil", "metas", "horarios", "sugerencia"]) {
    out[k] = { ...base[k], ...(datos[k] && typeof datos[k] === "object" ? datos[k] : {}) };
  }
  for (const k of ["dias", "sesiones", "pesos", "cintura", "precios", "compradas"]) {
    if (!out[k] || typeof out[k] !== "object" || Array.isArray(out[k])) out[k] = base[k];
  }
  for (const k of ["alimentosPropios", "molestias", "historialMetas"]) {
    if (!Array.isArray(out[k])) out[k] = base[k];
  }
  for (const k of ["plan", "rutina"]) {
    if (!out[k] || typeof out[k] !== "object") out[k] = base[k];
    for (const d of DIAS_ORDEN) if (!out[k][d]) out[k][d] = base[k][d];
  }
  if (!Number.isFinite(out.ajusteKcal)) out.ajusteKcal = 0;
  return out;
}

function cargar() {
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (!crudo) return false;
    const datos = migrar(JSON.parse(crudo));
    if (!datos) return false;
    S = datos;
    return true;
  } catch (e) {
    console.warn("No se pudo leer el almacenamiento local:", e);
    return false;
  }
}

let guardarTimer = null;
let hayCambios = false;
function guardar() {
  hayCambios = true;
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(guardarYa, 200);
}
function guardarYa() {
  clearTimeout(guardarTimer);
  hayCambios = false;
  try {
    localStorage.setItem(CLAVE, JSON.stringify(S));
  } catch (e) {
    toast("No se pudieron guardar los datos: almacenamiento lleno o bloqueado.");
    console.error(e);
  }
}
// Al cerrar la pestaña o mandarla al fondo, guarda lo pendiente sin esperar al
// debounce. Solo si hay cambios: una pestaña vieja no debe pisar a otra.
addEventListener("pagehide", () => { if (hayCambios) guardarYa(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && hayCambios) guardarYa(); });
// Si otra pestaña guardó, esta se pone al día.
addEventListener("storage", (e) => { if (e.key === CLAVE && cargar()) render(); });

/** Cambia el estado y vuelve a pintar. Todo pasa por aquí para no olvidar guardar. */
function commit(fn) {
  fn(S);
  guardar();
  render();
}

function exportarJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `micoach-${hoyISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Copia descargada.");
}

function importarJSON(archivo) {
  const lector = new FileReader();
  lector.onload = () => {
    try {
      let crudo;
      try { crudo = JSON.parse(String(lector.result)); }
      catch { throw new Error("el archivo no es un JSON válido."); }
      const datos = migrar(crudo);
      if (!datos) throw new Error("no tiene el formato de una copia de MiCoach.");
      S = datos;
      guardarYa();
      arrancar();
      toast("Datos restaurados.");
    } catch (e) {
      toast("No se pudo leer el archivo: " + e.message);
    }
  };
  lector.onerror = () => toast("No se pudo leer el archivo.");
  lector.readAsText(archivo);
}

const DIAS_JS = ["dom", "lun", "mar", "mie", "jue", "vie", "sab"];
const DIAS_ORDEN = ["lun", "mar", "mie", "jue", "vie", "sab", "dom"];
const DIA_NOMBRE = { lun: "Lunes", mar: "Martes", mie: "Miércoles", jue: "Jueves", vie: "Viernes", sab: "Sábado", dom: "Domingo" };
const DIA_CORTO = { lun: "Lun", mar: "Mar", mie: "Mié", jue: "Jue", vie: "Vie", sab: "Sáb", dom: "Dom" };

const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyISO = () => iso(new Date());
function deISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function sumarDias(s, n) { const d = deISO(s); d.setDate(d.getDate() + n); return iso(d); }
/** Días de a hasta b (positivo si b es posterior). */
const difDias = (a, b) => Math.round((deISO(b) - deISO(a)) / 864e5);
const claveDia = (s) => DIAS_JS[deISO(s).getDay()];
function lunesDe(s) { const d = deISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
/** Las n fechas que terminan en `hasta`, de la más antigua a la más reciente. */
const ventana = (hasta, n) => Array.from({ length: n }, (_, i) => sumarDias(hasta, i - n + 1));
const fechaCorta = (s) => { const d = deISO(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fechaDia = (s) => `${DIA_CORTO[claveDia(s)].toLowerCase()} ${fechaCorta(s)}`;
const fechaLarga = (s) => deISO(s).toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long" });
const fechaMedia = (s) => deISO(s).toLocaleDateString(LOCALE, { day: "numeric", month: "short", year: "numeric" });
function horaBonita(hhmm) {
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  const suf = h >= 12 ? "pm" : "am";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad(m)} ${suf}`;
}
const minutosDe = (hhmm) => { const [h, m] = (hhmm || "0:0").split(":").map(Number); return h * 60 + m; };

const r1 = (x) => Math.round(x * 10) / 10;
const redondeo5 = (x) => Math.round(x / 5) * 5;
const abajo50 = (x) => Math.floor(x / 50) * 50;
const suma = (arr) => arr.reduce((a, b) => a + b, 0);
const media = (arr) => (arr.length ? suma(arr) / arr.length : null);
function num(v) { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : null; }
function fmt(n, dec = 0) {
  if (n == null || !Number.isFinite(n)) return "—";
  return n.toLocaleString(LOCALE, { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
const kg = (n) => (n == null ? "—" : `${fmt(n, 1)} kg`);
const soles = (n) => `S/ ${fmt(n, 2)}`;
const conSigno = (n, dec = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n), dec);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const normalizar = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const slug = (s) => normalizar(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const plural = (n, uno, varios) => `${fmt(n)} ${n === 1 ? uno : varios}`;
/** 0.25 → ¼, 1.5 → 1½. Para cantidades de porciones. */
function fmtCant(c) {
  const ent = Math.floor(c + 1e-9);
  const frac = Math.round((c - ent) * 100) / 100;
  const f = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[frac];
  if (f) return (ent ? ent : "") + f;
  return fmt(c, frac ? 2 : 0);
}

let toastTimer = null;
const toastEl = document.getElementById("toast");
function toast(msg) {
  // Con un diálogo modal abierto, el aviso va dentro de él: si no, queda detrás del fondo.
  const d = document.getElementById("dlg");
  const host = d.open ? d : document.body;
  if (toastEl.parentNode !== host) host.appendChild(toastEl);
  const t = toastEl;
  t.textContent = msg;
  t.classList.add("ver");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("ver"), 3200);
}

/** Un ítem es {a: id, c: porciones} de la base, o {m: {nombre, kcal, p, c, g}} escrito a mano. */
function macrosItem(it) {
  if (it.m) return { kcal: +it.m.kcal || 0, p: +it.m.p || 0, c: +it.m.c || 0, g: +it.m.g || 0 };
  const a = alimento(it.a);

  const t = { kcal: 0, p: 0, c: 0, g: 0 };
  for (const it of items) {
    const m = macrosItem(it);
    t.kcal += m.kcal; t.p += m.p; t.c += m.c; t.g += m.g;
  }

}

function textoItem(it) {

  if (!a) return "(alimento borrado)";
  const gr = a.porcion.match(/^(\d+)\s*(g|ml)\b(.*)$/);
  if (gr) return `${a.nombre} · ${fmt(+gr[1] * it.c)} ${gr[2]}${gr[3]}`;
  if (it.c === 1) return `${a.nombre} (${a.porcion})`;
  return `${fmtCant(it.c)} × ${a.nombre}`;
}

/** Mifflin-St Jeor. */
function tmb(sexo, pesoKg, cm, edad) {
  const b = 10 * pesoKg + 6.25 * cm - 5 * edad;
  return sexo === "mujer" ? b - 161 : b + 5;
}
const gasto = (pesoKg) => tmb(S.perfil.sexo, pesoKg, S.perfil.altura, S.perfil.edad) * S.perfil.factor;
/** Gasto − déficit, redondeado hacia abajo a 50, más los ajustes ya aplicados. Nunca bajo el piso. */
function kcalCalculadas(pesoKg, ajuste = S.ajusteKcal) {
  return Math.max(S.perfil.piso, abajo50(gasto(pesoKg) - S.perfil.deficit) + ajuste);
}
/** Proteína fija; grasa ≈ 26.5 % de las kcal; carbos, el resto. */
function macrosPara(kcal, prot) {
  const g = redondeo5((kcal * 0.265) / 9);
  const c = Math.max(0, redondeo5((kcal - prot * 4 - g * 9) / 4));
  return { kcal, p: prot, c, g };
}
const proteinaInicial = (pesoKg) => redondeo5(1.65 * pesoKg);

/** Las metas que regían ese día: el pasado no se juzga con metas nuevas. */
function metasVigentes(f) {
  let m = null;
  for (const h of S.historialMetas) if (h.fecha <= f) m = h;

/** Único punto que cambia kcal y macros. Devuelve false si se intenta bajar del piso. */
function fijarMetas(nuevas, motivo) {
  if (nuevas.kcal != null && nuevas.kcal < S.perfil.piso) {
    toast(`No: el mínimo es ${fmt(S.perfil.piso)} kcal. Más abajo pierdes músculo y no lo sostienes.`);
    return false;

  S.metas = { ...S.metas, ...nuevas };
  const h = { fecha: hoyISO(), kcal: S.metas.kcal, p: S.metas.p, c: S.metas.c, g: S.metas.g, motivo };

/* ---- Intercambios ---- */

/** Cantidades de otros alimentos del mismo grupo que dan lo mismo del macro principal. */
function equivalentes(id, cant = 1) {
  const a = alimento(id);
  if (!a) return [];
  const macro = MACRO_GRUPO[a.grupo] || "kcal";
  const objetivo = a[macro] * cant;
  if (!(objetivo > 0)) return [];
  const ref = a.kcal * cant;
  return todosAlimentos()
    .filter((b) => b.id !== a.id && b.grupo === a.grupo && b[macro] > 0)
    .map((b) => {
      const c = Math.max(0.25, Math.round((objetivo / b[macro]) * 4) / 4);
      return { b, c, kcal: b.kcal * c, p: b.p * c, cc: b.c * c, g: b.g * c };
    })
    .filter((e) => e.c <= 4)   // 17 claras o 9 tajadas de jamón no son un cambio realista
    .sort((x, y) => Math.abs(x.kcal - ref) - Math.abs(y.kcal - ref));
}

/* ---- Lista de compras ---- */

function compraDe(a) {
  if (Array.isArray(a.compra)) return a.compra;
  if (typeof a.compra === "number" && a.compra > 0) return [a.id, 1];
  return null;
}
function infoCompra(clave) {
  if (COMPRAS[clave]) { const [nombre, u, precio] = COMPRAS[clave]; return { nombre, u, precioBase: precio }; }
  const a = alimento(clave);
  if (a && typeof a.compra === "number") {
    const u = a.grupo === "plato" ? "plato" : a.grupo === "bebida" ? "unid" : "porción";
    return { nombre: a.nombre, u, precioBase: a.compra };
  }
  return null;
}
const precioDe = (clave) => S.precios[clave] ?? infoCompra(clave)?.precioBase ?? 0;
/** kg y litros de 100 en 100 g/ml; lo demás, unidades enteras hacia arriba. */
function redondearCompra(cant, u) {
  if (u === "kg" || u === "L") return Math.max(0.1, Math.ceil(cant * 10 - 1e-6) / 10);
  return Math.max(1, Math.ceil(cant - 1e-6));
}
function listaCompras() {
  const acc = {};
  for (const d of DIAS_ORDEN) for (const cm of COMIDAS) for (const it of S.plan[d]?.[cm.id] || []) {
    if (it.m) continue;
    const a = alimento(it.a);
    const cp = a && compraDe(a);
    if (!cp) continue;
    acc[cp[0]] = (acc[cp[0]] || 0) + cp[1] * it.c;
  }
  const filas = Object.entries(acc).map(([clave, cant]) => {
    const inf = infoCompra(clave);
    if (!inf) return null;
    const q = redondearCompra(cant, inf.u);
    const precio = precioDe(clave);
    return { clave, nombre: inf.nombre, u: inf.u, cant: q, precio, subtotal: q * precio };
  }).filter(Boolean);
  filas.sort((x, y) => y.subtotal - x.subtotal);
  return { filas, total: suma(filas.map((f) => f.subtotal)) };
}

/** Promedio de los pesajes en [f−6, f]. Pide al menos 3 pesajes; si no, null. */
function prom7(f, desde = null) {
  const vals = [];
  for (let i = 0; i < 7; i++) {
    const d = sumarDias(f, -i);
    if (desde && d < desde) continue;
    const v = S.pesos[d];
    if (v != null) vals.push(v);
  }
  return vals.length >= 3 ? media(vals) : null;
}
const fechasPeso = () => Object.keys(S.pesos).sort();
function ultimoPeso() {
  const fs = fechasPeso();
  return fs.length ? { fecha: fs[fs.length - 1], kg: S.pesos[fs[fs.length - 1]] } : null;
}
const pesoActual = () => prom7(hoyISO()) ?? ultimoPeso()?.kg ?? S.perfil.pesoInicial;
/** Kilos perdidos en la última semana según el promedio móvil (positivo = bajó). */
function ritmoSemanal(hoy = hoyISO()) {
  const a0 = prom7(hoy), a7 = prom7(sumarDias(hoy, -7));
  return a0 != null && a7 != null ? a7 - a0 : null;
}

/** Días que faltan para poder sugerir otro cambio de kcal (14 tras aplicar o descartar). */
function diasEspera(hoy = hoyISO()) {
  const u = [S.sugerencia.aplicadaEl, S.sugerencia.descartadaEl].filter(Boolean).sort().pop();
  return u ? Math.max(0, 14 - difDias(u, hoy)) : 0;
}

/**
 * Ajuste automático según el promedio de 7 días:
 *  · no baja en 2 semanas (o casi nada en 3) → −150 kcal, sin pasar el piso;
 *  · baja más de 1.2 kg/semana dos semanas seguidas → +150 kcal. Las dos primeras
 *    semanas desde el primer pesaje no cuentan: esa bajada es agua y glucógeno.
 */
function sugerenciaKcal(hoy = hoyISO()) {
  const pf = S.perfil, m = S.metas;
  if (!pf.listo || diasEspera(hoy) > 0) return null;
  const a0 = prom7(hoy);
  if (a0 == null) return null;
  const a14 = prom7(sumarDias(hoy, -14)), a21 = prom7(sumarDias(hoy, -21));
  let semanas = 0, delta = 0;
  if (a14 != null && a0 - a14 > -0.2) { semanas = 2; delta = a0 - a14; }
  else if (a21 != null && a0 - a21 > -0.4) { semanas = 3; delta = a0 - a21; }
  if (semanas) {
    const motivo = `Tu promedio de 7 días no baja hace ${semanas} semanas (${conSigno(delta)} kg).`;
    if (m.kcal - 150 >= pf.piso) return { tipo: "bajar", kcal: m.kcal - 150, delta: -150, motivo };
    if (m.kcal > pf.piso) return { tipo: "bajar", kcal: pf.piso, delta: pf.piso - m.kcal, motivo };
    return {
      tipo: "mover", motivo,
      texto: `Ya estás en el piso de ${fmt(pf.piso)} kcal: la comida no baja más. Sube la meta a 10 000 pasos y agrega 10 min de caminadora.`,
    };
  }
  const primera = fechasPeso()[0];
  const desde = sumarDias(primera, 14);
  const b0 = prom7(hoy, desde), b7 = prom7(sumarDias(hoy, -7), desde), b14 = prom7(sumarDias(hoy, -14), desde);
  if (b0 != null && b7 != null && b14 != null && b7 - b0 > 1.2 && b14 - b7 > 1.2) {
    return {
      tipo: "subir", kcal: m.kcal + 150, delta: 150,
      motivo: `Bajas más de 1.2 kg por semana hace 2 semanas (${fmt(b14 - b7, 1)} y ${fmt(b7 - b0, 1)} kg). Muy rápido: se va músculo y rindes menos.`,
    };
  }
  return null;
}

/** Cada 3 kg perdidos (promedio 7 días) se recalculan las metas con el peso nuevo. */
function sugerenciaRecalculo(hoy = hoyISO()) {
  if (!S.perfil.listo || S.pesoRefRecalculo == null) return null;
  const a0 = prom7(hoy);
  if (a0 == null || a0 > S.pesoRefRecalculo - 3) return null;
  const d = S.sugerencia.recalcDescartadaEl;
  if (d && difDias(d, hoy) < 7) return null;
  return { peso: a0, perdido: S.pesoRefRecalculo - a0, nuevas: macrosPara(kcalCalculadas(a0), S.metas.p) };
}

function pendiente(puntos) {
  const mx = media(puntos.map((p) => p.x)), my = media(puntos.map((p) => p.y));
  let arriba = 0, abajo = 0;
  for (const p of puntos) { arriba += (p.x - mx) * (p.y - my); abajo += (p.x - mx) ** 2; }
  return abajo ? arriba / abajo : 0;
}
/** Fecha estimada para cada meta con la tendencia real de las últimas 4 semanas. */
function proyeccion(hoy = hoyISO()) {
  const pts = [];
  ventana(hoy, 28).forEach((f, i) => { const v = prom7(f); if (v != null) pts.push({ x: i, y: v }); });
  const base = prom7(hoy) ?? ultimoPeso()?.kg ?? null;
  const suficiente = pts.length >= 7 && pts[pts.length - 1].x - pts[0].x >= 10;
  const kgDia = suficiente ? -pendiente(pts) : null;
  const out = { base, suficiente, kgSemana: kgDia != null ? kgDia * 7 : null, metas: [] };
  if (base == null) return out;
  for (const [nombre, meta] of [["Meta intermedia", S.perfil.metaIntermedia], ["Meta final", S.perfil.metaFinal]]) {
    if (!meta) continue;
    const falta = base - meta;
    const r = { nombre, meta, falta };
    if (falta <= 0) r.lograda = true;
    else {
      if (kgDia != null && kgDia > 0.01) r.fecha = sumarDias(hoy, Math.ceil(falta / kgDia));
      r.rapida = sumarDias(hoy, Math.ceil(falta / (S.perfil.ritmoMax / 7)));
      r.lenta = sumarDias(hoy, Math.ceil(falta / (S.perfil.ritmoMin / 7)));
    }
    out.metas.push(r);
  }
  return out;
}

/* ---- Adherencia y rachas ---- */

/** Un día cumple si las kcal quedan a ±10 % de la meta y la proteína llega al 90 %. */
function evalDia(f) {
  if (!registrado(f)) return { registro: false, kcalOk: false, protOk: false, cumple: false };
  const t = totalesDia(f), m = metasVigentes(f);
  const kcalOk = t.kcal >= m.kcal * 0.9 && t.kcal <= m.kcal * 1.1;
  const protOk = t.p >= m.p * 0.9;
  return { registro: true, t, m, kcalOk, protOk, cumple: kcalOk && protOk };
}
const cumpleDieta = (f) => evalDia(f).cumple;
const cumpleVerdura = (f) => porcionesVerdura(f) >= 2;
/** Días seguidos que cumplen, contando hacia atrás. Hoy entra solo si ya cumple. */
function racha(pred, hoy = hoyISO()) {
  let f = pred(hoy) ? hoy : sumarDias(hoy, -1);
  let n = 0;
  while (n < 3660 && pred(f)) { n++; f = sumarDias(f, -1); }
  return n;
}
function mejorRacha(pred, hoy = hoyISO()) {
  const fs = Object.keys(S.dias).sort();
  if (!fs.length) return 0;
  let mejor = 0, act = 0;
  for (let f = fs[0]; f <= hoy; f = sumarDias(f, 1)) {
    if (pred(f)) { act++; mejor = Math.max(mejor, act); } else act = 0;
  }
  return mejor;
}

const diaDeEntreno = (d) => (S.rutina[d]?.ejercicios?.length || 0) > 0;
function seriesHechas(f) {
  const s = S.sesiones[f];
  return s ? suma(s.ejercicios.map((e) => e.series.filter((x) => x.hecho).length)) : 0;
}
const entrenoHecho = (f) => seriesHechas(f) > 0;

function adherenciaSemana(lunes, hoy = hoyISO()) {
  const dias = ventana(sumarDias(lunes, 6), 7).filter((f) => f <= hoy);
  if (!dias.length) return null;
  const ev = dias.map(evalDia);
  const planeados = dias.filter((f) => diaDeEntreno(claveDia(f))).length;
  const hechos = dias.filter(entrenoHecho).length;
  return {
    dias: dias.length,
    kcal: (ev.filter((e) => e.kcalOk).length / dias.length) * 100,
    prot: (ev.filter((e) => e.protOk).length / dias.length) * 100,
    entrenos: planeados ? Math.min(100, (hechos / planeados) * 100) : null,
    hechos, planeados,
  };
}

/* ---- Zinc: máximo 3 tomas en cualquier ventana de 7 días ---- */

const tomoZinc = (d) => !!leerDia(d).supl?.zinc;
/** ¿Se puede marcar zinc en f sin pasar de 3 en ninguna ventana de 7 días que incluya f? */
function zincPermitido(f) {
  for (let k = 0; k < 7; k++) {
    const n = ventana(sumarDias(f, k), 7).filter((d) => d === f || tomoZinc(d)).length;
    if (n > 3) return false;
  }
  return true;
}
function zincEstado(f) {
  const tomado = tomoZinc(f);
  const n = ventana(f, 7).filter(tomoZinc).length;
  const bloqueado = !tomado && !zincPermitido(f);
  let libera = null;
  if (bloqueado) for (let g = sumarDias(f, 1); g <= sumarDias(f, 7); g = sumarDias(g, 1)) if (zincPermitido(g)) { libera = g; break; }
  return { tomado, n, bloqueado, libera };
}

/* ============================================================================
   §6 · ENTRENO
   ========================================================================== */

const rutinaDe = (dia) => S.rutina[dia] || { nombre: "Descanso", ejercicios: [], cardio: null };
const seriesVacias = (n) => Array.from({ length: n }, () => ({ peso: null, reps: null, hecho: false }));
function ejDeRutina(e) {
  return {
    rid: e.id, nombre: e.nombre, ejId: slug(e.nombre), repMin: e.repMin, repMax: e.repMax, unidad: e.unidad,
    descanso: e.descanso, inc: e.inc, zona: e.zona, series: seriesVacias(e.series), plan: e.series,
  };
}
/** La sesión se crea al primer registro y copia la rutina: cambiarla después no altera el pasado. */
function asegurarSesion(f, dia) {
  if (!S.sesiones[f]) S.sesiones[f] = { dia, terminado: false, ejercicios: rutinaDe(dia).ejercicios.map(ejDeRutina) };
  return S.sesiones[f];
}
/** Lo que se ve en Entreno: la sesión si ya existe para ese día, si no la rutina sin empezar. */
function ejerciciosVista(f, dia) {
  const s = S.sesiones[f];
  if (s && s.dia === dia) return s.ejercicios;
  return rutinaDe(dia).ejercicios.map(ejDeRutina);
}

/** Última vez que se hizo ese ejercicio (por nombre), antes de la fecha dada. */
function anterior(ejId, antesDe) {
  const fs = Object.keys(S.sesiones).filter((f) => f < antesDe).sort().reverse();
  for (const f of fs) {
    for (const e of S.sesiones[f].ejercicios) {
      if (e.ejId !== ejId) continue;
      const hechas = e.series.filter((s) => s.hecho);
      if (hechas.length) return { fecha: f, series: hechas };
    }
  }
  return null;
}
function textoAnterior(ej, ant) {
  if (!ant) return "Sin registro anterior.";
  const u = ej.unidad === "s" ? " s" : "";
  const pesos = ant.series.map((s) => s.peso);
  const reps = ant.series.map((s) => fmt(s.reps) + u).join(" · ");
  const mismoPeso = pesos.every((p) => p === pesos[0]);
  let txt;
  if (ej.unidad === "s" && !pesos[0]) txt = reps;
  else if (mismoPeso) txt = `${fmt(pesos[0] || 0, 1)} kg × ${reps}`;
  else txt = ant.series.map((s) => `${fmt(s.peso || 0, 1)}×${fmt(s.reps)}`).join(" · ");
  return `Anterior (${fechaDia(ant.fecha)}): ${txt}`;
}
/** Sube carga solo si la vez anterior completaste el tope del rango en todas las series. */
function consejoCarga(ej, ant) {
  if (!ant) {
    return {
      tipo: "nuevo",
      texto: ej.unidad === "s"
        ? `Primera vez: aguanta ${ej.repMax} s por serie.`
        : `Primera vez: elige un peso con el que llegues a ${ej.repMin}–${ej.repMax} reps dejando 1-2 en reserva.`,
    };
  }
  const reps = ant.series.map((s) => s.reps || 0);
  const pesoMax = Math.max(...ant.series.map((s) => s.peso || 0));
  const completo = ant.series.length >= (ej.plan || ej.series.length) && reps.every((r) => r >= ej.repMax);
  if (ej.unidad === "s") {
    if (completo) return { tipo: "sube", texto: `Aguantaste ${ej.repMax} s en todas: hoy prueba ${ej.repMax + 5} s.`, reps: ej.repMax + 5 };
    return { tipo: "mantener", texto: `Busca llegar a ${ej.repMax} s en todas las series.` };
  }
  if (completo && ej.inc > 0) {
    const nuevo = r1(pesoMax + ej.inc);
    return { tipo: "sube", texto: `Completaste el rango: sube a ${fmt(nuevo, 1)} kg.`, peso: nuevo, reps: ej.repMin };
  }
  if (reps.some((r) => r < ej.repMin)) {
    return { tipo: "mantener", texto: `Mantén ${fmt(pesoMax, 1)} kg hasta llegar a ${ej.repMin} reps en todas las series.`, peso: pesoMax };
  }
  return { tipo: "mantener", texto: `Mantén ${fmt(pesoMax, 1)} kg y suma reps hasta ${ej.repMax} en todas las series.`, peso: pesoMax };
}

/* ---- Temporizador de descanso ----
   Guarda la hora de fin, no un contador: así sigue bien aunque se repinte la
   vista o el celular bloquee la pantalla un rato. */
const timer = { fin: 0, total: 0, id: null };
let audioCtx = null;
function prepararAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { audioCtx = null; }
}
function pitar() {
  if (!audioCtx) return;
  try {
    [0, 0.25, 0.5].forEach((t) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(audioCtx.currentTime + t);
      o.stop(audioCtx.currentTime + t + 0.2);
    });
  } catch { /* sin audio no pasa nada */ }
}
function iniciarDescanso(seg) {
  prepararAudio();
  timer.fin = Date.now() + seg * 1000;
  timer.total = seg;
  clearInterval(timer.id);
  timer.id = setInterval(tickTimer, 250);
  pintarTimer();
}
function ajustarDescanso(delta) {
  timer.fin = Math.max(Date.now() + 1000, timer.fin + delta * 1000);
  timer.total = Math.max(timer.total, Math.ceil((timer.fin - Date.now()) / 1000));
  pintarTimer();
}
function tickTimer() {
  if (Date.now() >= timer.fin) return terminarDescanso(true);
  const el = document.querySelector("#timer .t");
  if (!el) return pintarTimer();
  const rest = Math.ceil((timer.fin - Date.now()) / 1000);
  el.textContent = `${Math.floor(rest / 60)}:${pad(rest % 60)}`;
  document.querySelector("#timer .barra-prog > i").style.width = `${(1 - rest / timer.total) * 100}%`;
}
function pintarTimer() {
  const el = document.getElementById("timer");
  el.classList.remove("oculto");
  el.innerHTML = `
    <button class="icono-btn" data-act="timer-mas" data-v="-15" aria-label="Quitar 15 segundos">−15</button>
    <div class="crece">
      <div class="tenue">Descanso</div>
      <div class="t num">0:00</div>
      <div class="barra-prog"><i style="width:0"></i></div>
    </div>
    <button class="icono-btn" data-act="timer-mas" data-v="15" aria-label="Sumar 15 segundos">+15</button>
    <button class="icono-btn" data-act="timer-fin" aria-label="Saltar descanso">✕</button>`;
  tickTimer();
}
function terminarDescanso(avisar) {
  clearInterval(timer.id);
  timer.id = null;
  document.getElementById("timer").classList.add("oculto");
  if (avisar) {
    try { navigator.vibrate?.([300, 150, 300]); } catch { /* algunos navegadores no vibran */ }
    pitar();
    toast("Descanso terminado. A la siguiente serie.");
  }
}

/* ---- Pantalla encendida mientras entrenas (si el navegador lo permite) ---- */
let wakeLock = null;
async function pedirWakeLock() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch { wakeLock = null; }
}
function soltarWakeLock() { try { wakeLock?.release(); } catch { /* nada */ } wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  const s = S && S.sesiones[hoyISO()];
  if (!document.hidden && s && !s.terminado && entrenoHecho(hoyISO())) pedirWakeLock();
  if (!document.hidden && timer.id) tickTimer();
});

/* ============================================================================
   §7 · RESUMEN SEMANAL PARA EL COACH
   ========================================================================== */

function resumenSemanal(hasta = hoyISO()) {
  const dias = ventana(hasta, 7);
  const desde = dias[0];
  const previos = ventana(sumarDias(desde, -1), 7);
  const L = [];
  const pf = S.perfil, m = S.metas;

  L.push("RESUMEN SEMANAL · MiCoach");
  L.push(`Del ${fechaDia(desde)} al ${fechaDia(hasta)}`);

  // Peso
  L.push("", "PESO");
  const pesosSem = dias.map((f) => S.pesos[f]).filter((v) => v != null);
  const pesosPrev = previos.map((f) => S.pesos[f]).filter((v) => v != null);
  if (pesosSem.length) {
    const p = media(pesosSem);
    let linea = `• Promedio: ${kg(p)} (${plural(pesosSem.length, "pesaje", "pesajes")})`;
    if (pesosPrev.length) { const q = media(pesosPrev); linea += ` · semana anterior ${kg(q)} → ${conSigno(p - q)} kg`; }
    L.push(linea);
  } else L.push("• Sin pesajes esta semana.");
  const cSem = dias.filter((f) => S.cintura[f] != null);
  if (cSem.length) {
    const c = S.cintura[cSem[cSem.length - 1]];
    const antes = Object.keys(S.cintura).sort().filter((f) => f < cSem[0]).pop();
    L.push(`• Cintura: ${fmt(c, 1)} cm${antes ? ` (antes ${fmt(S.cintura[antes], 1)} cm)` : ""}`);
  }
  if (pf.metaIntermedia && pf.metaFinal) L.push(`• Metas: ${kg(pf.metaIntermedia)} y ${kg(pf.metaFinal)}`);

  // Dieta
  L.push("", "DIETA");
  const ev = dias.map(evalDia);
  const conReg = ev.filter((e) => e.registro);
  L.push(`• Meta: ${fmt(m.kcal)} kcal · ${fmt(m.p)} g proteína`);
  if (conReg.length) {
    L.push(`• Calorías: promedio ${fmt(media(conReg.map((e) => e.t.kcal)))} kcal · en rango (±10 %) ${ev.filter((e) => e.kcalOk).length}/7 días`);
    L.push(`• Proteína: promedio ${fmt(media(conReg.map((e) => e.t.p)))} g · 90 % o más ${ev.filter((e) => e.protOk).length}/7 días`);
  }
  const sinReg = ev.filter((e) => !e.registro).length;
  if (sinReg) L.push(`• Días sin registro de comida: ${sinReg}`);
  L.push(`• Verduras (2 porciones al día): ${dias.filter(cumpleVerdura).length}/7 días`);

  // Entreno
  L.push("", "ENTRENO");
  const plan = dias.filter((f) => diaDeEntreno(claveDia(f)));
  const marca = plan.map((f) => `${DIA_CORTO[claveDia(f)]} ${entrenoHecho(f) ? "✓" : "✗"}`).join("  ");
  L.push(`• Hechos: ${plan.filter(entrenoHecho).length}/${plan.length}${plan.length ? ` — ${marca}` : ""}`);
  const extra = dias.filter((f) => entrenoHecho(f) && !diaDeEntreno(claveDia(f))).length;
  if (extra) L.push(`• Entrenos en día de descanso: ${extra}`);
  const conCardio = dias.filter((f) => rutinaDe(claveDia(f)).cardio);
  if (conCardio.length) L.push(`• Cardio: ${conCardio.filter((f) => leerDia(f).cardio?.hecho).length}/${conCardio.length}`);
  const mol = S.molestias.filter((x) => x.fecha >= desde && x.fecha <= hasta);
  if (mol.length) {
    L.push(`• Hombro/pecho, "Me dolió": ${plural(mol.length, "vez", "veces")}`);
    const acc = { hoy: "cambio solo ese día", rutina: "cambiado en la rutina", anotar: "solo anotado" };
    for (const x of mol) {
      L.push(`  – ${fechaDia(x.fecha)}: ${x.ejercicio}${x.sustituto ? ` → ${x.sustituto}` : ""} (${acc[x.accion] || x.accion})${x.nota ? `. Nota: ${x.nota}` : ""}`);
    }
  } else L.push("• Sin molestias registradas.");

  // Hábitos
  L.push("", "HÁBITOS");
  const pasos = dias.map((f) => leerDia(f).pasos).filter((v) => v != null);
  if (pasos.length) L.push(`• Pasos: promedio ${fmt(media(pasos))} (meta ${fmt(m.pasos)}) · ${pasos.filter((v) => v >= m.pasos).length}/7 días en meta`);
  else L.push("• Pasos: sin registro");
  const sueno = dias.map((f) => leerDia(f).sueno).filter((v) => v != null);
  if (sueno.length) L.push(`• Sueño: promedio ${fmt(media(sueno), 1)} h (meta ${fmt(m.sueno, 1)} h)`);
  else L.push("• Sueño: sin registro");
  const agua = dias.map((f) => leerDia(f).aguaMl).filter((v) => v > 0);
  if (agua.length) L.push(`• Agua: promedio ${fmt(media(agua) / 1000, 1)} L`);
  const supl = SUPLEMENTOS.map((s) => {
    const n = dias.filter((f) => leerDia(f).supl?.[s.id]).length;
    return s.id === "zinc" ? `zinc ${n}` : `${s.nombre.split(" ")[0].toLowerCase()} ${n}/7`;
  });
  L.push(`• Suplementos: ${supl.join(" · ")}`);

  // Ajustes de metas
  const ajustes = S.historialMetas.filter((h) => h.fecha >= desde && h.fecha <= hasta && h.motivo !== "Inicio");
  const sug = sugerenciaKcal(hasta);
  if (ajustes.length || sug) {
    L.push("", "AJUSTES");
    for (const h of ajustes) L.push(`• ${fechaDia(h.fecha)}: ${fmt(h.kcal)} kcal · ${fmt(h.p)} P / ${fmt(h.c)} C / ${fmt(h.g)} G — ${h.motivo}`);
    if (sug) L.push(`• Pendiente: ${sug.tipo === "mover" ? sug.texto : `${sug.delta > 0 ? "+" : ""}${fmt(sug.delta)} kcal`} (${sug.motivo})`);
  }

  // Notas
  const notas = dias.filter((f) => (leerDia(f).nota || "").trim());
  L.push("", "NOTAS");
  if (notas.length) for (const f of notas) L.push(`• ${fechaDia(f)}: ${leerDia(f).nota.trim()}`);
  else L.push("• Sin notas.");
  return L.join("\n");
}

async function copiarTexto(txt) {
  try {
    await navigator.clipboard.writeText(txt);
    toast("Resumen copiado. Pégalo en el chat con tu coach.");
    return;
  } catch { /* file:// o permisos: se intenta a la antigua */ }
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { ok = false; }
  ta.remove();
  if (ok) toast("Resumen copiado. Pégalo en el chat con tu coach.");
  else dlgTexto("Copia el resumen", txt);
}

let chartEstado = "cargando";       // "ok" | "error"

function cargarChart() {
  if (window.Chart) { chartEstado = "ok"; configurarChart(); return; }
  const s = document.createElement("script");
  s.src = CHART_URL;
  s.integrity = CHART_SRI;
  s.crossOrigin = "anonymous";

  s.onerror = () => { chartEstado = "error"; pintarGraficos(); };

}
const color = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function configurarChart() {
  if (!window.Chart) return;
  Chart.defaults.color = color("--tinta-2");

  Chart.defaults.plugins.legend.labels.boxWidth = 12;

function pintarGraficos() {

function proximaMeta() {
  const p = pesoActual();
  const { metaIntermedia: a, metaFinal: b } = S.perfil;
  if (a && p > a) return a;
  if (b && p > b) return b;
  return null;
}

function cfgPeso() {
  const hoy = hoyISO();
  const fs = fechasPeso();
  const n = rangoPeso || Math.max(14, fs.length ? difDias(fs[0], hoy) + 1 : 14);
  const dias = ventana(hoy, n);
  const meta = proximaMeta();
  const ds = [
    {
      label: "Peso", data: dias.map((f) => S.pesos[f] ?? null), showLine: false,
      pointRadius: n > 60 ? 2 : 3, pointBackgroundColor: color("--tinta-3"), borderColor: color("--tinta-3"),
    },
    {
      label: "Promedio 7 días", data: dias.map((f) => prom7(f)), borderColor: color("--acento"),
      backgroundColor: color("--acento"), pointRadius: 0, borderWidth: 3, tension: 0.3, spanGaps: true,
    },
  ];
  if (meta) {
    ds.push({
      label: `Meta ${fmt(meta, 1)} kg`, data: dias.map(() => meta), borderColor: color("--aviso"),
      backgroundColor: color("--aviso"), borderDash: [6, 5], pointRadius: 0, borderWidth: 1.5,

function semanasAdherencia(hoy = hoyISO()) {
  const primero = Object.keys(S.dias).sort()[0] || hoy;
  const lun = lunesDe(hoy);

    <p class="sub">Para ese ejercicio ya. Prueba un sustituto más amable con el hombro, con menos peso y sin llegar al fallo. Si duele igual, deja por hoy los ejercicios de pecho y hombro y coméntalo con tu coach o un médico.</p>
    ${ops.map((o, i) => `<label class="toggle"><input type="radio" name="sust" value="${esc(o)}"${i === 0 ? " checked" : ""} style="width:22px;height:22px;flex:none"> <span>${esc(o)}</span></label>`).join("")}
    <label class="campo" style="margin-top:12px"><span>Nota (opcional)</span><input type="text" id="dolio-nota" placeholder="Ej.: pinchazo al bajar la mancuerna"></label>
    <div class="botones" style="flex-direction:column">
      <button class="btn prim grande" data-act="dolio" data-modo="hoy" data-i="${idx}">Cambiar solo hoy</button>
      <button class="btn" data-act="dolio" data-modo="rutina" data-i="${idx}">Cambiar en la rutina</button>
      <button class="btn fantasma" data-act="dolio" data-modo="anotar" data-i="${idx}">Solo anotar</button>
    </div>`);
}
function aplicarDolio(idx, modo) {
  const sust = document.querySelector('input[name="sust"]:checked')?.value || null;
  const nota = document.getElementById("dolio-nota")?.value.trim() || "";
  const dia = entDia;
  commit((S) => {
    const ses = asegurarSesion(fecha, dia);
    const ej = ses.ejercicios[idx];
    S.molestias.push({ id: uid(), fecha, dia, ejercicio: ej.nombre, sustituto: modo === "anotar" ? null : sust, accion: modo, nota });
    if (modo === "anotar" || !sust) return;
    const hechas = ej.series.filter((s) => s.hecho).length;
    const nuevo = { ...ej, nombre: sust, ejId: slug(sust), sustDe: ej.nombre, dolio: false, series: seriesVacias(Math.max(1, ej.series.length - hechas)) };
    if (hechas) {
      ej.series = ej.series.filter((s) => s.hecho);
      ej.dolio = true;
      ses.ejercicios.splice(idx + 1, 0, nuevo);
    } else {
      ses.ejercicios[idx] = nuevo;
    }
    if (modo === "rutina") {
      const r = S.rutina[dia].ejercicios.find((x) => x.id === ej.rid);
      if (r) r.nombre = sust;
    }
  });
  cerrarDlg();
  toast(modo === "anotar" ? "Anotado. Sale en tu resumen semanal." : `Cambiado por ${sust}. Queda anotado en el resumen.`);
}

function barraMacro(nombre, v, meta, varColor) {
  const pct = meta ? Math.min(100, (v / meta) * 100) : 0;
  const pasado = meta && v > meta * 1.1;
  return `<div class="macro">
    <div class="linea"><span>${nombre}</span><span class="num${pasado ? " malo" : ""}"><b>${fmt(v)}</b> / ${fmt(meta)} g</span></div>
    <div class="barra-prog"><i style="width:${pct}%;background:var(${varColor})"></i></div>
  </div>`;
}
const PLURAL_U = { unid: "unid", lata: "latas", pote: "potes", bolsa: "bolsas", paquete: "paquetes", plato: "platos", porción: "porciones" };
function fmtCompra(c, u) {
  if (u === "kg") return c < 1 ? `${fmt(c * 1000)} g` : `${fmt(c, 1)} kg`;
  if (u === "L") return c < 1 ? `${fmt(c * 1000)} ml` : `${fmt(c, 1)} L`;
  return `${fmt(c)} ${c === 1 ? u : PLURAL_U[u] || u}`;
}
const cardioTxt = (c) => `${esc(c.nombre)} ${c.minMin === c.minMax ? c.minMin : `${c.minMin}-${c.minMax}`} min`;

/* ---------------------------------- HOY ---------------------------------- */

/** La comida pendiente más reciente cuya hora ya llegó (o llega en 45 min). */
function laQueToca() {
  const d = leerDia(hoyISO());
  const ahora = new Date();
  const min = ahora.getHours() * 60 + ahora.getMinutes();
  const llegadas = COMIDAS.filter((cm) => !d.comidas[cm.id] && minutosDe(S.horarios[cm.id]) - 45 <= min);
  return llegadas.length ? llegadas[llegadas.length - 1].id : null;
}

function tarjetaComida(f, cm, toca) {
  const r = leerDia(f).comidas[cm.id];
  const estado = r?.estado;
  const items = estado === "comido" ? r.items : planDe(f)[cm.id] || [];
  const t = sumarMacros(items);
  let etq = "";
  if (estado === "comido") etq = '<span class="etq ok">✓ Comido</span>';
  else if (estado === "saltado") etq = '<span class="etq">No comí</span>';
  else if (toca === cm.id) etq = '<span class="etq ahora">Toca ahora</span>';
  const lista = items.length
    ? `<ul class="items">${items.map((it) => `<li>${esc(textoItem(it))}</li>`).join("")}</ul>`
    : '<p class="sub">Nada en el plan para esta comida.</p>';
  const botones = estado
    ? `<div class="botones">
        <button class="btn chico" data-act="comida-cambiar" data-c="${cm.id}">Cambiar</button>
        <button class="btn chico fantasma" data-act="comida-deshacer" data-c="${cm.id}">Deshacer</button>
      </div>`
    : `<div class="botones">
        <button class="btn prim" data-act="comida-ok" data-c="${cm.id}">✓ Lo comí</button>
        <button class="btn" data-act="comida-cambiar" data-c="${cm.id}">Cambiar</button>
        <button class="icono-btn" style="width:48px;height:48px" data-act="comida-saltar" data-c="${cm.id}" aria-label="No comí ${cm.nombre.toLowerCase()}">✕</button>
      </div>`;
  return `<div class="card comida${estado === "comido" ? " hecha" : estado === "saltado" ? " saltada" : ""}">
    <div class="cab">
      <div class="crece"><b>${cm.nombre}</b> <span class="hora">${horaBonita(S.horarios[cm.id])}</span></div>
      ${etq}<span class="sub num">${fmt(t.kcal)} kcal</span>
    </div>
    ${lista}${botones}
  </div>`;
}

function tarjetasAviso() {
  let h = "";
  const sug = sugerenciaKcal();
  if (sug && sug.tipo === "mover") {
    h += `<div class="card alerta">
      <b>Ajuste sugerido</b>
      <p class="sub">${esc(sug.motivo)}</p><p>${esc(sug.texto)}</p>
      <div class="botones"><button class="btn prim" data-act="sug-aplicar">Aplicar</button><button class="btn" data-act="sug-descartar">Ahora no</button></div>
    </div>`;
  } else if (sug) {
    const nuevas = macrosPara(sug.kcal, S.metas.p);
    h += `<div class="card alerta">
      <b>Ajuste sugerido: ${sug.delta > 0 ? "+" : "−"}${fmt(Math.abs(sug.delta))} kcal</b>
      <p class="sub">${esc(sug.motivo)}</p>
      <p>Meta nueva: <b>${fmt(sug.kcal)} kcal</b> (hoy ${fmt(S.metas.kcal)}) · P ${nuevas.p} · C ${nuevas.c} · G ${nuevas.g}.
      ${sug.kcal === S.perfil.piso ? ` Es el piso: de ahí no se baja.` : ""}</p>
      <div class="botones"><button class="btn prim" data-act="sug-aplicar">Aplicar</button><button class="btn" data-act="sug-descartar">Ahora no</button></div>
    </div>`;
  }
  const rec = sugerenciaRecalculo();
  if (rec) {
    h += `<div class="card alerta">
      <b>Bajaste ${fmt(rec.perdido, 1)} kg: toca recalcular</b>
      <p class="sub">Con ${kg(rec.peso)} tu gasto es menor. Metas nuevas: <b>${fmt(rec.nuevas.kcal)} kcal</b> · P ${rec.nuevas.p} · C ${rec.nuevas.c} · G ${rec.nuevas.g}.</p>
      <div class="botones"><button class="btn prim" data-act="recalc-aplicar">Aplicar</button><button class="btn" data-act="recalc-descartar">Ahora no</button></div>
    </div>`;
  }
  return h;
}

    </div>
    ${barraMacro("Proteína", t.p, m.p, "--prot")}

  h += `<h2 class="titulo-sec">Comidas</h2>`;

  const tx = sumarMacros(d.extras);

    ${d.extras.length ? `<ul class="items">${d.extras.map((it) => `<li>${esc(textoItem(it))}</li>`).join("")}</ul>`

    <div class="botones"><button class="btn" data-act="extras">${d.extras.length ? "Editar extras" : "+ Extra"}</button></div>
  </div>`;

  // Hábitos
  const v = porcionesVerdura(f);
  h += `<h2 class="titulo-sec">Hábitos</h2>`;

    <div class="card-cab"><b class="crece">Reto: 2 porciones de verdura</b><span class="etq${v >= 2 ? " ok" : ""}">${fmtCant(v)}/2</span></div>

    <div class="vasos" aria-hidden="true">${Array.from({ length: Math.max(metaV, vasos) }, (_, i) => `<i class="${i < vasos ? "lleno" : ""}"></i>`).join("")}</div>

      <button class="btn" data-act="agua" data-v="-250" aria-label="Quitar un vaso">− vaso</button>
      <button class="btn prim" data-act="agua" data-v="250">+ vaso (250 ml)</button>
    </div>

  // Suplementos
  const cuentan = SUPLEMENTOS.filter((s) => s.cuenta);
  h += `<div class="card">

        if (z.bloqueado) { bloq = true; extra = ` · Bloqueado: ya van 3 en 7 días.${z.libera ? ` Vuelve el ${fechaDia(z.libera)}.` : ""}`; }
      }
      return `<button class="toggle" data-act="supl" data-id="${s.id}" aria-pressed="${on}"${bloq ? " disabled" : ""}>

    }).join("")}

  // Entreno
  const dia = claveDia(f), ses = S.sesiones[f];
  const r = rutinaDe(ses ? ses.dia : dia);
  h += `<h2 class="titulo-sec">Entreno</h2><div class="card">`;
  if (r.ejercicios.length) {

  // Pasos y sueño
  const pasosPct = d.pasos ? Math.min(100, (d.pasos / S.metas.pasos) * 100) : 0;

    <label class="campo"><span>Pasos de hoy · meta ${fmt(S.metas.pasos)}</span>

      </div>

    <p class="tenue">Meta ${fmt(S.metas.sueno, 1)} h. Con poco sueño da más hambre y rindes menos.</p>

  // Peso y nota
  h += `<div class="card">
    <label class="campo"><span>Peso en ayunas (kg)</span>
      <div class="fila-input">

  return h;
}

function vistaDieta() {
  const tabs = [["plan", "Plan"], ["alimentos", "Alimentos"], ["intercambios", "Cambios"], ["compras", "Compras"]];
  const h = `<div class="seg" role="group" aria-label="Secciones de dieta">${tabs.map(([k, v]) =>
    `<button data-act="dieta-tab" data-v="${k}" aria-pressed="${dietaTab === k}">${v}</button>`).join("")}</div>`;
  return h + { plan: dietaPlan, alimentos: dietaAlimentos, intercambios: dietaIntercambios, compras: dietaCompras }[dietaTab]();
}

function dietaPlan() {
  const hoy = hoyISO();
  const dia = dietaDia || claveDia(hoy);
  const p = S.plan[dia];
  const items = COMIDAS.flatMap((cm) => p[cm.id] || []);
  const t = sumarMacros(items), m = S.metas;
  const verd = suma(items.filter((it) => !it.m && alimento(it.a)?.grupo === "verdura").map((it) => it.c));
  const semana = ventana(hoy, difDias(lunesDe(hoy), hoy) + 1);
  let h = `<div class="card">
    <div class="card-cab"><b class="crece">Reto: 2 porciones de verdura al día</b><span class="etq${cumpleVerdura(hoy) ? " ok" : ""}">Hoy ${fmtCant(porcionesVerdura(hoy))}/2</span></div>
    <p class="sub">Racha: ${plural(racha(cumpleVerdura), "día", "días")} · Esta semana: ${semana.filter(cumpleVerdura).length}/${semana.length} · Mejor racha: ${plural(mejorRacha(cumpleVerdura), "día", "días")}</p>
  </div>`;
  h += `<div class="chips" style="margin-top:12px">${DIAS_ORDEN.map((d) =>
    `<button class="chip" data-act="plan-dia" data-v="${d}" aria-pressed="${d === dia}">${DIA_CORTO[d]}</button>`).join("")}</div>`;
  // Pasarse de proteína no es problema; en lo demás, más de 10 % de diferencia es aviso.
  const dif = (v, meta, minimo = false) => {
    const okk = minimo ? v >= meta * 0.9 : Math.abs(v - meta) <= meta * 0.1;
    return `<div><div class="tenue">${fmt(v)} / ${fmt(meta)}</div><div class="${okk ? "bien" : "aviso-txt"}">${conSigno(v - meta, 0)}</div></div>`;
  };
  h += `<div class="card">
    <div class="card-cab"><b class="crece">${DIA_NOMBRE[dia]}: total del plan</b><span class="num"><b>${fmt(t.kcal)}</b> / ${fmt(m.kcal)} kcal</span></div>
    <div class="tres-col num" style="text-align:center">
      <div><b style="color:var(--prot)">Proteína</b>${dif(t.p, m.p, true)}</div>
      <div><b style="color:var(--carb)">Carbos</b>${dif(t.c, m.c)}</div>
      <div><b style="color:var(--gras)">Grasa</b>${dif(t.g, m.g)}</div>
    </div>
    ${Math.abs(t.kcal - m.kcal) > m.kcal * 0.1 ? `<p class="aviso-txt" style="margin-top:8px">El plan se aleja más de 10 % de tu meta (${conSigno(t.kcal - m.kcal, 0)} kcal). Ajusta porciones.</p>` : ""}
    ${verd < 2 ? `<p class="aviso-txt" style="margin-top:8px">Este día tiene ${fmtCant(verd)} de 2 porciones de verdura.</p>` : ""}
  </div>`;
  for (const cm of COMIDAS) {
    const its = p[cm.id] || [];
    h += `<div class="card comida">
      <div class="cab"><div class="crece"><b>${cm.nombre}</b> <span class="hora">${horaBonita(S.horarios[cm.id])}</span></div>
      <span class="sub num">${fmt(sumarMacros(its).kcal)} kcal</span></div>
      ${its.length ? `<ul class="items">${its.map((it) => `<li>${esc(textoItem(it))}</li>`).join("")}</ul>` : '<p class="sub">Vacío.</p>'}
      <div class="botones"><button class="btn chico" data-act="plan-editar" data-dia="${dia}" data-c="${cm.id}">Editar</button></div>
    </div>`;
  }
  h += `<div class="botones">
    <button class="btn" data-act="copiar-dia" data-dia="${dia}">Copiar a otros días</button>
    <button class="btn peligro" data-act="plan-reset">Restablecer plan</button>
  </div>`;
  return h;
}
